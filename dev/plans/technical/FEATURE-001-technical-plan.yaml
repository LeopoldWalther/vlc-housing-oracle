    - id: "2.6"
      title: "Redact descriptions under r1"
      description: |
        `redact.sql` defines the macro `redact_personal(text)`: regexp_replace with option 'g' of
        `(\+34[ .-]?|0034[ .-]?|\b)[6789]([ .-]?[0-9]){8}` with `[phone]`, then of
        `\b(Sr|Sra|Srta|Don|Doña|Dña)\.?\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+` with `[name]`. build_tables creates
        it before the table statements; listing_text.sql applies it to description and adds
        redaction_version = 'r1'. Titles, location and features stay verbatim.
      status: "not_started"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["2.5"]
      branch: "feature/silver-rebuild/2.6-redaction"
      commit_message: "feat(silver): redact phone numbers and names in descriptions (r1)"
      acceptance_criteria:
        - "Phone formats '600 000 000', '+34600000000.', '0034 600-000-000', '+34 700 000 000h' become [phone]"
        - "'Sra. García' becomes [name]"
        - "A description with two numbers and a name has all three replaced"
        - "'690.000 €', 'Ref 123456789' and 'reformado 2023' survive unchanged"
        - "A title 'calle Don Juan' stays verbatim"
        - "Every listing_text row has redaction_version 'r1'"
      tdd:
        red:
          test_file: "tests/test_silver_redaction.py"
