    - id: "3.1"
      title: "Iceberg sink with an explicit schema check"
      description: |
        `write_silver_tables(catalog, namespace, tables, properties) -> dict[str, int]` in
        `src/silver/sink.py`: create the namespace and missing tables from the Arrow schema; for an
        existing table, first compare the ordered column names of the Arrow table with
        `[f.name for f in table.schema().fields]` and raise `SilverSchemaError` naming missing and
        extra columns; then `table.overwrite(arrow, snapshot_properties=properties)`, re-raising
        PyIceberg's ValueError as SilverSchemaError with `from` (review M1). Return each table's
        `current_snapshot().snapshot_id` after its commit. Adds
        `pyiceberg[pyarrow,sql-sqlite,glue]==0.12.0` to requirements.txt. Tests use a SqlCatalog on
        SQLite in a temporary directory.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.2"]
      branch: "feature/silver-rebuild/3.1-iceberg-sink"
      commit_message: "feat(silver): Iceberg sink with an explicit schema check"
      acceptance_criteria:
        - "A first write creates namespace and tables and returns one snapshot id per table"
        - "A second write overwrites; scanning the first snapshot id returns the first rows"
        - "Both commits' snapshot summaries carry the given properties"
        - "A missing column, an extra column and a changed type each raise SilverSchemaError and leave the current snapshot unchanged"
        - "A list<string> column round-trips without a false schema error"
      tdd:
        red:
          test_file: "tests/test_silver_sink.py"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_sink.py' -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.silver.sink'"
        green:
          behavior: "Create-or-load, name comparison, overwrite with properties, wrapped type errors"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_sink.py' -v"
        refactor:
          rule: "None expected"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/silver/__init__.py"
        - "src/silver/sink.py"
        - "tests/test_silver_sink.py"
        - "requirements.txt"
      forbidden_files:
        - "src/silver/sql/**"
      can_run_parallel_with: ["1.3", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create:
        - "src/silver/sink.py"
        - "tests/test_silver_sink.py"
      files_to_modify:
        - "src/silver/__init__.py"
        - "requirements.txt"

    - id: "3.2"
      title: "rebuild() end to end on synthetic landing"
      description: |
        `rebuild(connection, catalog, *, landing, now) -> RebuildResult` sets
        `TimeZone = 'UTC'`, calls register_landing, build_tables (all Arrow tables before any
        commit), then write_silver_tables into NAMESPACE with properties transformation_version,
        redaction_version, landing_contract_sha256 (from src/contracts.py) and rebuild_started_at
        (now(), ISO-8601 UTC). RebuildResult is a frozen dataclass mapping table -> row count and
        table -> snapshot id.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.3", "2.6", "3.1"]
      branch: "feature/silver-rebuild/3.2-rebuild"
      commit_message: "feat(silver): rebuild Silver from landing into Iceberg"
      acceptance_criteria:
        - "Over generate_landing(seed=1), row counts in RebuildResult equal each table's scan"
        - "Snapshot summaries carry the contract digest, both versions and the fixed instant"
        - "It succeeds when the connection's session zone was 'Europe/Madrid'"
        - "A non-conforming landing raises LandingContractError and creates no table"
        - "Regression guard: two rebuilds give equal row sets per table"
      tdd:
        red:
          test_file: "tests/test_silver_rebuild.py"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_rebuild.py' -v"
          expected_failure: "ImportError: cannot import name 'rebuild' from 'src.silver.rebuild'"
        green:
          behavior: "Compose register_landing, build_tables and write_silver_tables with the injected clock"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_rebuild.py' -v"
        refactor:
          rule: "None expected"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/silver/rebuild.py"
        - "tests/test_silver_rebuild.py"
      forbidden_files:
        - "src/synthetic/**"
      can_run_parallel_with: ["4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create:
        - "tests/test_silver_rebuild.py"
      files_to_modify:
        - "src/silver/rebuild.py"

    - id: "3.3"
      title: "The rebuild CLI"
      description: |
        `main(argv=None) -> int` and `if __name__ == "__main__"` in src/silver/rebuild.py:
        `python -m src.silver.rebuild --landing <dir> --catalog <name>`. The catalog resolves via
        `pyiceberg.catalog.load_catalog(name)`; the clock is `datetime.now(UTC)`. Prints one line per
        table with row count and snapshot id. Exit 2 for usage errors (argparse, missing landing
        directory), exit 1 with the error message for LandingContractError or SilverSchemaError.
        The test sets PYICEBERG_HOME to its temporary directory and PYICEBERG_CATALOG__TEST__URI and
        __WAREHOUSE to a SQLite catalog (L3).
      status: "not_started"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["3.2"]
      branch: "feature/silver-rebuild/3.3-cli"
      commit_message: "feat(silver): command-line rebuild"
      acceptance_criteria:
        - "A run over synthetic landing exits 0 and prints each of the four tables with row count and snapshot id"
        - "A missing --landing directory exits 2 with a message"
        - "A non-conforming landing exits 1 naming the table"
      tdd:
        red:
          test_file: "tests/test_silver_cli.py"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_cli.py' -v"
          expected_failure: "The subprocess exits non-zero because src.silver.rebuild has no __main__ entry"
        green:
          behavior: "argparse main composing load_catalog, duckdb.connect and rebuild"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_cli.py' -v"
        refactor:
          rule: "None expected"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/silver/rebuild.py"
        - "tests/test_silver_cli.py"
      forbidden_files:
        - "src/synthetic/**"
      can_run_parallel_with: ["4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create:
        - "tests/test_silver_cli.py"
      files_to_modify:
        - "src/silver/rebuild.py"

    - id: "4.1"
      title: "Glue database as code, validated in CI"
      description: |
        Validation-first infrastructure task. `infra/silver/`: aws_glue_catalog_database
        `vlc_housing_silver` with location_uri "s3://${var.lake_bucket}/silver/"; variables
        lake_bucket (no default) and region (default eu-central-1); hashicorp/aws ">= 5.0, < 6.0";
        required_version ">= 1.10, < 2.0"; S3 backend with partial configuration and
        backend.hcl.example holding placeholders only; infra/silver/.terraform.lock.hcl committed.
        CI gains a `terraform-validate` job using hashicorp/setup-terraform with
        terraform_version 1.14.6 and running exactly the command in final_commands. No apply happens
        in this task; the operator applies after merge.
      status: "not_started"
      complexity: "low"
      estimated_hours: 1.5
      depends_on: []
