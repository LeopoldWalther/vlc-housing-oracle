# Technical plan for FEATURE-001 — Silver on Iceberg against landing/v1.
# Emitted by the reviewer with the approved review; it incorporates review corrections M1-M3 and
# L1-L4. The task statuses here are the source of truth for progress.

technical_plan:
  metadata:
    for_feature: "FEATURE-001"
    created_by: "reviewer_agent"
    created_at: "2026-10-15"
    version: "1.0"
    total_tasks: 14
    estimated_hours: "19"
    risk_level: "medium"
    critical_path: ["1.1", "1.2", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "3.2", "3.3", "4.2"]
    feature_plan: "dev/plans/FEATURE-001-silver-rebuild.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-001.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "workflow-consistency"
      - "terraform-validate"
    # No coverage threshold is configured in the repository or the approved plan.
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
      - "terraform -chdir=infra/silver init -backend=false && terraform -chdir=infra/silver fmt -check && terraform -chdir=infra/silver validate"

  conventions: |
    - Imports are `src.<package>` from the repository root (`src/__init__.py`), matching
      `python -m unittest discover -s tests -t .` and `python -m src.silver.rebuild`.
    - Every fixture is synthetic: ids start with `syn-`, areas are invented, phone numbers use
      repeated digits where the digits do not matter (L4). No test touches AWS or the network.
    - Error messages carry table names, column names and counts, never row values.
    - Silver constants live in `src/silver/rebuild.py`: NAMESPACE = "vlc_housing_silver",
      TRANSFORMATION_VERSION = "silver-v1", REDACTION_VERSION = "r1".

  tasks:
    - id: "1.1"
      title: "Pin the landing contract copy"
      description: |
        Copy `contracts/landing/v1/schema.json` byte for byte from the private acquisition
        repository and pin its SHA-256. Write a public `contracts/landing/v1/README.md`: grain and
        meaning of each table, what landing does not do (dedupe, newest record, events, redaction),
        and the rule that a change is `landing/v2`. Name no source, provider, bucket or private path.
      status: "done"
      complexity: "low"
      estimated_hours: 0.5
      depends_on: []
      branch: "feature/silver-rebuild/1.1-contract-pin"
      commit_message: "feat(contracts): pin the landing v1 contract copy"
      acceptance_criteria:
        - "SHA-256 of contracts/landing/v1/schema.json equals f52989ab75f2321393082ea882a2b88c5630b51d22c71ff8af44335092369b72"
        - "contracts/landing/v1/README.md documents the four tables and the v2 rule"
        - "python dev/tools/check_leaks.py passes"
      tdd:
        red:
          test_file: "tests/test_landing_contract.py"
          command: "python -m unittest discover -s tests -t . -p 'test_landing_contract.py' -v"
          expected_failure: "FileNotFoundError: contracts/landing/v1/schema.json does not exist"
        green:
          behavior: "Add the byte-for-byte copy and the README"
          command: "python -m unittest discover -s tests -t . -p 'test_landing_contract.py' -v"
        refactor:
          rule: "None expected"
          command: "python dev/tools/check_leaks.py"
      validation_commands:
        - "python -m unittest discover -s tests -t . -p 'test_landing_contract.py' -v"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "contracts/landing/v1/schema.json"
        - "contracts/landing/v1/README.md"
        - "tests/test_landing_contract.py"
      forbidden_files:
        - "src/**"
      can_run_parallel_with: ["4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create:
        - "contracts/landing/v1/schema.json"
        - "contracts/landing/v1/README.md"
        - "tests/test_landing_contract.py"
      files_to_modify: []

    - id: "1.2"
      title: "Write typed landing tables from rows"
      description: |
        `src/contracts.py` reads the contract (`landing_v1_columns() -> dict[str, list[tuple[str, str]]]`
        and `landing_v1_sha256() -> str`, computed from the file). `src/synthetic/landing.py`
        provides `write_landing_tables(directory, rows_by_table)`, which writes
        `<directory>/<table>.parquet` via a typed DuckDB SELECT built from the contract, with absent
        columns NULL. Adds `duckdb==1.5.6` to requirements.txt and removes `src/.gitkeep`.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.1"]
      branch: "feature/silver-rebuild/1.2-landing-writer"
      commit_message: "feat(synthetic): write typed landing tables from rows"
      acceptance_criteria:
        - "One walk row writes walk.parquet whose DESCRIBE equals the contract's walk columns in order"
        - "A column absent from the rows is NULL and keeps its contract type, including an all-null INTEGER"
        - "An unknown table name or column name raises ValueError naming it"
        - "landing_v1_sha256() equals the pinned digest"
      tdd:
        red:
          test_file: "tests/test_synthetic_landing.py"
          command: "python -m unittest discover -s tests -t . -p 'test_synthetic_landing.py' -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.synthetic'"
        green:
          behavior: "Contract reader plus a writer composing one typed SELECT per table and COPY TO parquet"
          command: "python -m unittest discover -s tests -t . -p 'test_synthetic_landing.py' -v"
        refactor:
          rule: "The contract is parsed only in src/contracts.py"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/__init__.py"
        - "src/.gitkeep"
        - "src/contracts.py"
        - "src/synthetic/__init__.py"
        - "src/synthetic/landing.py"
        - "tests/test_synthetic_landing.py"
        - "requirements.txt"
      forbidden_files:
        - "contracts/landing/v1/schema.json"
      can_run_parallel_with: ["4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create:
        - "src/__init__.py"
        - "src/contracts.py"
        - "src/synthetic/__init__.py"
        - "src/synthetic/landing.py"
        - "tests/test_synthetic_landing.py"
      files_to_modify:
        - "src/.gitkeep"
        - "requirements.txt"

    - id: "1.3"
      title: "Seeded synthetic landing with the hard cases"
      description: |
        `generate_landing(directory, *, seed)` writes all four tables via write_landing_tables:
        named scenario rows plus filler from `random.Random(seed)`. Scenarios: a recorded replay, an
        inferred replay, a legacy walk with null run instants, a two-area run crossing midnight,
        a lone empty card, one listing on one day in two areas (priced + empty), one listing only as
        two empty cards in two areas, a listing with detail records on two days, a listing with two
        detail records at the same observed_at and ingested_at in two areas, an observation-only
        listing, and descriptions containing synthetic phone numbers and honorific names. Every
        listing_detail row has exactly one listing_text row, and the landing keys from task 2.1 are
        unique.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.2"]
      branch: "feature/silver-rebuild/1.3-synthetic-generator"
      commit_message: "feat(synthetic): seeded landing generator with the hard cases"
      acceptance_criteria:
        - "All four tables conform to the contract by DESCRIBE"
        - "Each named scenario is present (asserted per scenario by query)"
        - "The same seed gives equal row sets; two seeds give different filler"
        - "Every source_listing_id starts with 'syn-'"
      tdd:
        red:
          test_file: "tests/test_synthetic_landing.py"
          command: "python -m unittest discover -s tests -t . -p 'test_synthetic_landing.py' -v"
          expected_failure: "ImportError: cannot import name 'generate_landing'"
        green:
          behavior: "Hand-written scenario rows plus seeded filler"
          command: "python -m unittest discover -s tests -t . -p 'test_synthetic_landing.py' -v"
        refactor:
          rule: "One small function per named scenario"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "python dev/tools/check_leaks.py"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/synthetic/landing.py"
        - "tests/test_synthetic_landing.py"
      forbidden_files:
        - "src/silver/**"
      can_run_parallel_with: ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "3.1", "4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create: []
      files_to_modify:
        - "src/synthetic/landing.py"
        - "tests/test_synthetic_landing.py"

    - id: "2.1"
      title: "Check landing at the boundary"
      description: |
        `register_landing(connection, directory)` in `src/silver/landing.py` creates the views
        `landing_walk`, `landing_observation`, `landing_listing_detail`, `landing_listing_text` after
        checking each file, and raises `LandingContractError` (defined there) otherwise. Checks
        (review M2, M3):
        - the file exists and DESCRIBE equals the contract (name and type, in order);
        - per-table non-null columns: walk (source, area, observed_date); observation (source, area,
          source_listing_id, observed_at, observed_date, is_empty_card); listing_detail and
          listing_text (source, area, source_listing_id, observed_at, observed_date);
        - unique keys: observation (source, area, source_listing_id, observed_date); listing_detail
          and listing_text (source, area, source_listing_id, observed_at);
        - listing_detail and listing_text keys match one to one.
        Messages name the table, the columns or key, and a count; never values.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["1.2"]
      branch: "feature/silver-rebuild/2.1-landing-boundary"
      commit_message: "feat(silver): check landing against the contract at the boundary"
      acceptance_criteria:
        - "A conforming directory registers four views"
        - "A missing file, a reordered column and a wrong type each raise LandingContractError naming the table"
        - "A null source_listing_id and a null is_empty_card each raise with table, column and count"
        - "A duplicate observation key and a duplicate listing_detail key each raise with table and count"
        - "A listing_detail row without a listing_text row raises, and so does the reverse"
        - "No error message contains a row value"
      tdd:
        red:
          test_file: "tests/test_silver_landing.py"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_landing.py' -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.silver'"
        green:
          behavior: "DESCRIBE comparison, then one aggregate query per null, uniqueness and pairing rule"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_landing.py' -v"
        refactor:
          rule: "Keep the per-table rule table as data in one place"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/silver/__init__.py"
        - "src/silver/landing.py"
        - "tests/test_silver_landing.py"
      forbidden_files:
        - "src/synthetic/**"
      can_run_parallel_with: ["1.3", "3.1", "4.1"]
      reversible: true
      rollback: "Revert the task commit"
      files_to_create:
        - "src/silver/__init__.py"
        - "src/silver/landing.py"
        - "tests/test_silver_landing.py"
      files_to_modify: []

