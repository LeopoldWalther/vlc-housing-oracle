    - id: "4.2"
      title: "Runbook and one operator run"
      description: |
        Validation-first documentation task. Write docs/silver-rebuild.md: terraform apply with the
        private backend config; syncing landing/v1 to a local directory; a ~/.pyiceberg.yaml Glue entry
        with placeholders; the command; the four schemas and their rules; snapshot properties;
        reading a pinned snapshot from DuckDB (iceberg_scan) and PyIceberg; why the reported snapshot
        is the post-commit APPEND; the partial-rebuild signal; rollback via manage_snapshots.
        Update the README status line. The operator then runs the rebuild against real landing and
        the progress log of the feature plan records counts only: rows per table; Silver observation
        <= landing observation; listing_text rows = listing rows with a detail record; a counts-only
        residual phone/honorific probe over Silver description, location and features. A probe hit
        in location or features means a follow-up r2 feature, not a change here.
      status: "not_started"
      complexity: "low"
      estimated_hours: 1.5
      depends_on: ["3.3", "4.1"]
      branch: "feature/silver-rebuild/4.2-runbook"
      commit_message: "docs(silver): rebuild runbook and first operator run"
      acceptance_criteria:
        - "docs/silver-rebuild.md covers every item in the description with placeholders only"
        - "README status line says Silver is implemented and names the command"
        - "The feature plan's progress log records the operator run as counts only"
        - "python dev/tools/check_leaks.py and validate_workflow.py pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "docs/silver-rebuild.md"
        - "README.md"
        - "dev/plans/FEATURE-001-silver-rebuild.md"
      forbidden_files:
        - "src/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the documentation commit; a Silver snapshot written by the operator run stays in the private warehouse and is harmless"
      files_to_create:
        - "docs/silver-rebuild.md"
      files_to_modify:
        - "README.md"
        - "dev/plans/FEATURE-001-silver-rebuild.md"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/silver-rebuild/integration"
    task_branch_strategy: |
      Create the integration branch from main. A task without dependencies (1.1, 4.1) starts from
      the integration branch. A dependent task starts from the integration branch after all of its
      depends_on tasks are merged into it. 1.2 and 3.1 both edit requirements.txt; 3.1 depends on 1.2
      so they never conflict.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch with
      --no-ff in dependency order (1.1, 1.2, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 1.3, 3.1, 3.2, 3.3, then
      4.1 whenever ready, 4.2 last), never rewriting history, and run validation.final_commands there.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "fix", "test", "docs", "refactor", "chore"]
    push_policy: "Never push or open a PR without explicit user approval"
    final_pr_title: "feat(silver): Silver on Iceberg against landing/v1"
    final_pr_description: |
      Implements FEATURE-001. See dev/reviews/REVIEW-FEATURE-001.md for context.

  notes:
    - "rebuild() must SET TimeZone = 'UTC': DuckDB exports TIMESTAMPTZ in the session zone and PyIceberg rejects non-UTC (plan Assumption 1)."
    - "Never compare Arrow schemas for equality against an Iceberg table: large_string, element names and field-id metadata differ (review M1)."
    - "PyIceberg overwrite accepts a missing column silently; the name check in 3.1 is what prevents it (review M1)."
    - "An overwrite writes DELETE then APPEND snapshots; report current_snapshot() after the commit."
    - "DuckDB regexp_replace replaces only the first match without the 'g' option."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
