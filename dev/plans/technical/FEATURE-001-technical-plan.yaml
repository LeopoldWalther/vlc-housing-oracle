        - "python dev/tools/check_leaks.py"
        - "ruff check src tests dev && ruff format --check src tests dev"
      allowed_files:
        - "src/silver/rebuild.py"
        - "src/silver/sql/redact.sql"
        - "src/silver/sql/listing_text.sql"
        - "tests/test_silver_redaction.py"
      forbidden_files:
