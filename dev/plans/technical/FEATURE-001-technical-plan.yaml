        (area, run_started_at). Tests use write_landing_tables fixtures, not the generator.
      status: "not_started"
      complexity: "low"
      estimated_hours: 1
      depends_on: ["2.1"]
      branch: "feature/silver-rebuild/2.2-walk"
      commit_message: "feat(silver): walk table"
      acceptance_criteria:
        - "Two areas of one run, a legacy report and a recorded replay give three rows with unchanged contract columns"
        - "Every row has transformation_version 'silver-v1'"
        - "Arrow types: timestamps tz=UTC, observed_date date32, pages int32, complete bool"
      tdd:
        red:
          test_file: "tests/test_silver_walk.py"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_walk.py' -v"
