    - id: "2.4"
      title: "Silver listing, attributes only"
      description: |
        `listing.sql`: one row per (source, source_listing_id) in the union of Silver observation
        and landing listing_detail. A `chosen_detail` CTE picks the newest detail record by
        observed_at DESC, ingested_at DESC NULLS LAST, municipality ASC, district ASC NULLS FIRST,
        operation ASC. The row carries every listing_detail column of that record except the key
        columns repeated below, renaming its observed_at to detail_observed_at and keeping its
        ingested_at; plus first_seen = min(observed_date), last_seen = max(observed_date) and
        days_observed = count(*) over every Silver observation row of the listing, empty cards
        included (L1); plus transformation_version. A listing without detail has null attribute and
        area columns (area, operation, municipality, district) (L2); a detail-only listing has null
        seen columns. No title, description, location or features column. Ordered by
        source_listing_id.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 2
      depends_on: ["2.3"]
      branch: "feature/silver-rebuild/2.4-listing"
      commit_message: "feat(silver): listing attributes from the newest detail record"
      acceptance_criteria:
        - "Detail records on two days: attributes and detail_observed_at come from the newer"
        - "Two records with equal observed_at and ingested_at in two areas: the first municipality wins"
        - "first_seen, last_seen and days_observed count every deduplicated observation including empty cards"
        - "An observation-only listing has null attributes and null area columns; a detail-only listing has null seen columns"
        - "No title, description, location or features column exists"
        - "Output is unique on (source, source_listing_id); an all-null attribute keeps its type"
      tdd:
        red:
          test_file: "tests/test_silver_listing.py"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_listing.py' -v"
          expected_failure: "KeyError: 'listing' — build_tables returns no listing table"
        green:
          behavior: "listing.sql with the chosen_detail CTE and the seen aggregate, full outer joined"
          command: "python -m unittest discover -s tests -t . -p 'test_silver_listing.py' -v"
        refactor:
          rule: "Put the chosen_detail CTE where 2.5 can reuse it (a view created in build_tables)"
          command: "python -m unittest discover -s tests -t . -v"
      validation_commands:
