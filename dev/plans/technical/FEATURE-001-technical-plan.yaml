        - "python dev/tools/check_leaks.py"
        - "python -m unittest discover -s tests -t . -p 'test_tooling_pins.py' -v"
      allowed_files:
        - "infra/silver/main.tf"
        - "infra/silver/variables.tf"
        - "infra/silver/providers.tf"
        - "infra/silver/backend.tf"
        - "infra/silver/backend.hcl.example"
        - "infra/silver/.terraform.lock.hcl"
