        - "dev/plans/FEATURE-012-text-labels.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-012-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/text-labels/integration"
    task_branch_strategy: |
      Create the integration branch from main once main holds this feature's plan, review and
      technical plan. Each task branch starts from the integration branch after the tasks it
      depends on are merged there. Tasks 1.1 and 1.2 have no dependency and may run beside each
      other and beside 1.3 to 1.5; every other task runs alone. Before task 3.1, FEATURE-009,
      FEATURE-010 and FEATURE-011 must be on main, and main is merged into the integration
      branch with --no-ff; if one of them is not merged yet, task 3.1 waits. Task 4.3 starts
      from main after the final PR is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 2.1, 2.2, 2.3, 3.1, 3.2, 4.1, 4.2
      (1.2 as soon as the user's labels are back, and before 1.6), never rewriting history, and
      run validation.final_commands there. The final PR goes from the integration branch to
      main. Task 4.3's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): renovation state and auctions read from the description by a model"
    final_pr_description: |
      Implements FEATURE-012: a labeller command stores one model answer per redacted sale
      description as an immutable input, and a Silver run given --text-labels writes
      listing_text_label from them. See dev/reviews/REVIEW-FEATURE-012.md (approved) and ADR
      0005. Nothing is applied by this PR; task 4.3 deploys with approval.

  notes:
    - "Never print, log or commit a description, a hash or a listing id; every record is counts. The evaluation set and its results stay in a private directory outside the repository."
    - "Only the description leaves Silver. The title is not redacted and names a street."
    - "Every paid run needs the user's approval with an upper bound: the evaluation of task 1.6 and each run of task 4.3."
    - "The Bedrock request is checked against botocore's service model by the stub. If the service rejects the forced tool choice or the output limit for the chosen model in task 1.6, stop and return to the reviewer; do not work around it in the operator run."
    - "The model id and its ARNs are account configuration: task arguments and gitignored tfvars, never a default in the repository."
    - "infra/silver/*.tfvars hold real values and are gitignored: never stage, print or commit them."
    - "The start rule must name the Silver task definition's family. A rule on the cluster alone starts the labeller from the labeller."
    - "Read the columns the text labels need from Silver before listing_quality(), listing_events() or listing_prices() is called: each replaces temporary tables the fallback read uses."
    - "A changed prompt, schema or model is a new LABEL_VERSION; the evaluation is repeated for it before the backlog is labelled again."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
