        - "A run after the batch ended writes its part under the layout of the conventions and submits nothing; the run after that writes no file"
        - "A text whose request errored is submitted again by the run that collects its batch"
        - "A run with a cap below the pending count leaves the rest, and the next run submits exactly the rest"
        - "A collected batch without a succeeded request makes the run exit 1 after its part is written and its texts are submitted again"
        - "stored_answers of an empty or missing directory is an empty table with the schema; a part without a column exits 1 and names the part and the column"
        - "Stored answers of another model under LABEL_VERSION exit 1 and nothing is written or submitted"
        - "Without injected batches and without ANTHROPIC_API_KEY the command exits 1 and names the variable"
        - "The output contains no description, no hash and no key"
      tdd:
        red:
          test_file: "tests/test_enrichment_text_labels.py"
          change: "Add a class that backfills a SQLite catalog from generate_landing_v3 once and runs main with fake batches and a fixed clock."
          command: "python -m unittest tests.test_enrichment_text_labels -v"
          expected_failure: "ImportError: cannot import name 'main' from 'src.enrichment.text_labels'"
        green:
          change: "The readers, the writers and the command."
          command: "python -m unittest tests.test_enrichment_text_labels -v"
        refactor:
          change: "None expected beyond docstrings."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
