    - id: "2.3"
      title: "The command and the stored parts"
      description: |
        In src/enrichment/text_labels.py: stored_answers(connection, labels) -> pyarrow.Table
        reads every part under <labels> with the columns of ANSWER_SCHEMA_ARROW and returns an
        empty table of that schema when no part exists; a part that lacks a column raises
        StoredAnswerError naming the part's path below <labels> and the column.
        part_writer(labels, run_id) returns the write_part of the conventions' layout through
        pyarrow.fs.FileSystem.from_uri, and refuses to replace an existing part. main(argv, *,
        labeler=None, now=...) is python -m src.enrichment.text_labels --catalog <name> --labels
        <dir-or-s3> --model-id <id> --max-texts <n>: it reads source, source_listing_id and
        operation of Silver's listing and source, source_listing_id and description of
        listing_text through the catalog, runs check_model, pending_texts and label_texts, and
        prints the report as "pending: <n>", "labelled: <n>", "invalid answers: <n>", "input
        tokens: <n>", "output tokens: <n>", "remaining: <n>". Exit code 0 on success, 1 for
        LabelVersionError or StoredAnswerError (message without a value), 2 for usage. For an
