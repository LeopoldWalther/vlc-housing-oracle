# Technical plan for FEATURE-012 — Labels read from the description by a language model.
# Emitted by the reviewer with the approval of 2026-11-16 (corrections M1 to M6) and updated with
# the approval of the amendment of 2026-11-20 (corrections R1 to R7): the model is reached through
# the Claude API, and the labeller submits a message batch in one run and collects it in a later
# one. Task statuses here are the source of truth for progress.
# Tasks 1.1 to 1.5 are done and unchanged. Phase 3 starts after main is merged into the
# integration branch.

technical_plan:
  metadata:
    for_feature: "FEATURE-012"
    created_by: "reviewer_agent"
    created_at: "2026-11-20"
    version: "2.0"
    total_tasks: 17
    estimated_hours: "26"
    risk_level: "medium"
    critical_path: ["1.1", "1.3", "1.7", "1.8", "1.9", "1.6", "2.1", "2.2", "2.3", "3.1", "3.2", "4.1", "4.2", "4.3"]
    feature_plan: "dev/plans/FEATURE-012-text-labels.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-012.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "terraform-validate"
      - "workflow-consistency"
    # No coverage threshold is configured.
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
      - "terraform -chdir=infra/silver init -backend=false && terraform -chdir=infra/silver fmt -check && terraform -chdir=infra/silver validate"

  conventions: |
    - Only the redacted description of a sale listing is hashed and sent: never the title, the
      location, the features or a listing identifier (review M2). An empty description (null, or
      nothing but white space) is never hashed, sent or stored.
    - text_sha256 is DuckDB's sha256(description): the SHA-256 of the UTF-8 bytes as lower-case
      hex. Both the labeller and Silver compute it in SQL; a test pins it to Python's hashlib.
    - Label values. renovation_state is one of new_build, renovated, original,
      needs_renovation, unknown; is_auction is a boolean. The definitions and their decision
      order are those of the feature plan's "Label definitions" and go word for word into
      SYSTEM_PROMPT.
    - src/enrichment/labeler.py holds the domain types and nothing that knows a service:
        RENOVATION_STATES                       the five values, in the order above
        TextLabel(renovation_state, is_auction) frozen dataclass
        LabelResult(label, input_tokens, output_tokens)
                                                frozen dataclass; label is None for an answer
                                                outside the schema
        TextLabeler                             Protocol with label(description: str) -> LabelResult
        label_from_answer(answer) -> TextLabel | None
                                                None unless answer is a mapping with exactly
                                                the keys renovation_state (one of the five
                                                values) and is_auction (a bool, not 0 or 1)
    - src/enrichment/prompt.py holds LABEL_VERSION, SYSTEM_PROMPT, ANSWER_TOOL_NAME and
      ANSWER_SCHEMA (the JSON schema of the answer). LABEL_VERSION names the prompt, the schema
      and the model: a change of any of the three is a new value, never an edit. It is "tl2"
      today and becomes "tl3" in task 1.7, whose prompt names no tool (review R1); ANSWER_TOOL_NAME
      is used by the Bedrock request only.
    - src/enrichment/claude_api.py is the only module that imports the anthropic SDK. One
      function, message_request(model_id, description), builds the request that the evaluation
      sends directly and the labeller sends inside a batch. It sets model, max_tokens =
      MAX_OUTPUT_TOKENS = 4096 (the model's thinking counts toward it), system = SYSTEM_PROMPT,
      one user message holding the description, and output_config.format = {type: json_schema,
      schema: ANSWER_SCHEMA}. It sets no temperature, top_p, top_k, thinking, effort, tools or
      tool_choice. The SDK reads the key from the environment variable ANTHROPIC_API_KEY; the
      key is never an argument, a default, a fixture or a log line.
    - Every SDK name used in src/enrichment/claude_api.py (the request fields, the batch
      object's status, end time and results location, the result entries) is taken from the
      pinned SDK's own types or from the claude-api skill's Python files, never from memory.
    - A stored answer has these columns, in order, with Arrow types (ANSWER_SCHEMA_ARROW in
      src/enrichment/text_labels.py):
        text_sha256        string
        label_version      string
        model_id           string
        renovation_state   string
        is_auction         bool
        labeled_at         timestamp(us, UTC)
        input_tokens       int32
        output_tokens      int32
    - Stored answers live under <labels>/label_version=<v>/run=<batch_id>/part-0.parquet, where
      <labels> is a directory or an s3:// location: one part per collected batch, holding the
      batch's valid answers ordered by text_sha256, with the batch's end as labeled_at. It is
      written once, also with no row, and never replaced; collecting a batch twice gives the
      same file. The partition values are also columns of the file; a reader does not rely on
      hive partitioning.
    - A submitted batch has a record under
      <batches>/label_version=<v>/batch=<batch_id>/record.parquet with these columns, in order
      (BATCH_RECORD_SCHEMA_ARROW in src/enrichment/text_labels.py), ordered by text_sha256:
        text_sha256        string
        label_version      string
        model_id           string
        batch_id           string
        submitted_at       timestamp(us, UTC)
      <batches> is a sibling of <labels>, never below it, so Silver's read of the answers does
      not meet a record. A batch is open when its record exists and its part does not. The
      record and the part are the whole state: there is no table of batches, no cursor and no
      listing of the provider's batches.
    - A text is pending when it is a non-empty description of a sale listing, has no stored
      answer under LABEL_VERSION and is in no open batch of LABEL_VERSION.
    - The private evaluation set is a CSV file outside the repository with the columns number,
      stratum, stratum_population, description, renovation_state, is_auction (true or false).
      It is passed by path and never copied into the repository, a fixture or a log.
    - The Silver table listing_text_label: one row per row of listing_text, ordered by source,
      source_listing_id. Columns, in order, with Arrow types:
        source                   string
        source_listing_id        string
        renovation_state         string     null until the text is labelled, and for every
                                            listing that is not a sale
        is_auction               bool       as renovation_state
        label_version            string     null with the labels
        model_id                 string     null with the labels
        labeled_at               timestamp(us, UTC)   null with the labels
        transformation_version   string
      Of several stored answers for one text_sha256 under LABEL_VERSION the one with the newest
      labeled_at wins; answers of another label_version are ignored.
    - TEXT_LABEL_TABLE = "listing_text_label" is a constant of src/silver/rebuild.py and is not
      a member of SILVER_TABLES: it exists only for a run given --text-labels.
    - No text, no hash, no listing identifier and no key is printed or logged by any command;
      reports are counts.
    - No test calls a model or a cloud service. The Bedrock labeller is tested with
      botocore.stub.Stubber on a client built with dummy credentials and a fixed region. The
      Claude API classes are tested with a fake client object that records the keyword
      arguments of each call and returns prepared objects; no test builds an HTTP request or
      reads ANTHROPIC_API_KEY.
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table, column or test expectation
      about other tables changes.
    - Tests use synthetic values only (source "syn", invented texts) and compare results as
      Arrow rows (to_pylist()).
    - All repository artifacts are in English.

  tasks:
    - id: "1.1"
      title: "ADR 0005 and the architecture note"
      description: |
        docs/adr/0005-model-derived-labels.md after the form of ADR 0003: context (a model's
        answer is not reproducible; Silver must be), decision (answers are immutable inputs
        under enrichment/v1/text_label/, keyed by text_sha256 and label_version, written by this
        repository's own command and read by Silver; one call per text; only the redacted
        description leaves Silver), consequences (a new label_version relabels everything; a
        backfill costs nothing; a second input beside landing; processing may happen outside the
        EU by the user's decision of 2026-11-16) and rejected alternatives (a model call inside
        the Silver run; the labeller writing the Silver table; an agent runtime; batch
        inference). CLAUDE.md: the Target Architecture section names the enrichment input in one
        short entry, and the sentence that nothing in the repository fetches or parses source
        pages stays as it is.
      status: "done"
      complexity: "low"
      estimated_hours: 0.75
      depends_on: []
      branch: "feature/text-labels/1.1-adr"
      commit_message: "docs(adr): model-derived labels as immutable inputs"
      acceptance_criteria:
        - "ADR 0005 states context, decision, consequences and the rejected alternatives"
        - "CLAUDE.md names the enrichment input and changes no other rule"
        - "The leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "docs/adr/0005-model-derived-labels.md"
        - "CLAUDE.md"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
      can_run_parallel_with: ["1.2"]
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "docs/adr/0005-model-derived-labels.md"
      files_to_modify:
        - "CLAUDE.md"

    - id: "1.2"
      title: "Evaluation set (operator and user)"
      description: |
        Private work; nothing but counts enters the repository.
        1. In Athena, on the sale listings joined to their text row, assign each listing to the
           first stratum that applies, in the order of the review's table (A to H), with these
           keyword tests on the lower-cased description: auction 'subasta'; needs renovation
           'para reformar|a reformar|necesita (una )?reforma|requiere reforma|para actualizar';
           renovated 'reformad[oa]|recién reformad|totalmente reformad|reforma integral'.
           Listings with an empty description or without a condition are not sampled.
        2. Draw distinct descriptions at random with a recorded seed: A 40, B 30, C 15, D 40,
           E 10, F 35, G 15, H 15 (200 in all). Record each stratum's population.
        3. Write the sample to a private directory outside the repository, shuffled and
           numbered, without stratum, condition or identifier in the file the labeller sees, and
           keep the mapping from number to stratum, population and text_sha256 beside it.
        4. Mail the file to the user with the label definitions of the feature plan; the user
           fills in the two labels and returns it.
        5. Join the returned labels to the mapping and write the evaluation set of the
           conventions to the private directory.
        6. Create dev/plans/implementations/FEATURE-012-text-labels.md with a section
           "Evaluation set": the date, the strata with population and sample size, the seed, and
           the distribution of the hand labels as counts. No text, no hash, no identifier.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.0
      depends_on: []
      branch: "feature/text-labels/1.2-evaluation-set"
      commit_message: "docs(plans): FEATURE-012 evaluation set, strata and hand-label counts"
      acceptance_criteria:
        - "The private evaluation set holds 200 rows with the six columns of the conventions and no empty label"
        - "The strata's populations sum to the sale listings minus those not sampled"
        - "The implementation note holds counts only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-012-text-labels.md"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: ["1.1", "1.3", "1.4", "1.5"]
      reversible: true
      rollback: "Revert the commit; delete the private directory"
      files_to_create:
        - "dev/plans/implementations/FEATURE-012-text-labels.md"
      files_to_modify: []

    - id: "1.3"
      title: "Answer type, validation and prompt"
