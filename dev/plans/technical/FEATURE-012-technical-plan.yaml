    - id: "1.6"
      title: "Paid evaluation and gate (operator, with approval)"
      description: |
        Two Bedrock runs with Claude Haiku 4.5 are recorded (prompts tl1 and tl2); renovated
        failed both and the gate is open. The rest of this task runs after tasks 1.7 to 1.9
        and after the user has linked the API credit (or bought a small amount), created the
        key and stored it as a Parameter Store SecureString. Every paid step needs the user's
        approval with its upper bound; reading the parameter is an AWS action and needs it too.
        The key reaches a command only as ANTHROPIC_API_KEY in that command's environment,
        read from the Parameter Store in the same shell line, and is never printed or stored.
        1. Extend the largest stratum (F) by 30 distinct descriptions drawn at random with a
           recorded seed from the texts not yet in the set, labelled under the definitions
           before any model reads them, and add them to the private evaluation set with the
           stratum's population. Record the new counts.
        2. Send one batch of one text of the evaluation set with ClaudeApiBatches and collect
           it (review R3). It must end with a valid answer. If the batch call refuses the
           structured output, the custom_id or the organization's limits, stop and return to
           the reviewer before phase 2.
        3. Run the evaluation command three times with --provider claude-api and Claude Haiku
           5.5, each with --results into the private directory.
        4. Gate: renovated, needs_renovation and is_auction each need a weighted precision of
           at least 0.90 and a weighted recall of at least 0.80 in every one of the three runs.
        5. Only if renovated fails: three runs with Claude Sonnet 5.5, the same gate, and the
           user decides between the larger model and dropping the label. A dropped label
           returns the plan to the reviewer before phase 2.
        6. Record in the implementation note, as counts only: the three reports per model, the
           tokens per text, the cost of the runs, the cost of the backlog and of a month from
           the measured tokens, the gate's result and the user's decision. The chosen model is
           the model of LABEL_VERSION tl3; a prompt change after this point is a new version
           and a new evaluation.
        7. Add the progress-log entry to the feature plan.
      status: "done"
      complexity: "medium"
      estimated_hours: 2.0
      depends_on: ["1.2", "1.5", "1.7", "1.8", "1.9"]
      branch: "feature/text-labels/1.6-claude-api-evaluation"
      commit_message: "docs(plans): FEATURE-012 evaluation through the Claude API and the gate"
      acceptance_criteria:
        - "The implementation note records the batch of one text, three reports per evaluated model, the tokens, the cost and the estimates"
        - "The gate's result per decisive value in every run and the user's decision are recorded"
        - "The note holds counts only; the leak guard and the workflow validator pass"
