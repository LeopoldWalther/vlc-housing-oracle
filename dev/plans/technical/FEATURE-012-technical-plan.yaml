    - id: "4.1"
      title: "Infrastructure: the labeller task and its start rule"
      description: |
        infra/silver/labels.tf:
        - a task definition for the labeller on the existing cluster and image, ARM64, 0.25 vCPU
          and 1 GB, with entryPoint ["python", "-m", "src.enrichment.text_labels"] and the
          command --catalog silver --labels s3://<lake bucket>/enrichment/v1/text_label
          --model-id <label_model_id> --max-texts <label_max_texts>, the catalog environment of
          the Silver task and its log group with the stream prefix "labeller";
        - a task role that may read the Glue database and the Silver table files, list and
          write under enrichment/v1/text_label/ and nowhere else, and call bedrock:InvokeModel
          on the resources of label_model_arns only;
        - an EventBridge rule whose pattern is: source aws.ecs, detail-type "ECS Task State
          Change", the cluster's ARN, lastStatus STOPPED, stopCode EssentialContainerExited,
          containers exitCode 0, and group "family:<the Silver task definition's family>"; its
          state follows labeller_enabled; its target runs the labeller task on Fargate with the
          Silver task's network configuration, through a role limited to ecs:RunTask on this
          task definition and iam:PassRole on its two roles.
        infra/silver/variables.tf: label_model_id (string), label_model_arns (list of strings),
        label_max_texts (number, default 2000) and labeller_enabled (bool, default false).
        infra/silver/ecs.tf: the Silver task's command gains --text-labels with the same
        location, and its role may read that prefix. infra/silver/alerts.tf: the failure mail's
        text says that the task may be the Silver task or the labeller and that only the Silver
        task is retried by the queue.
        Nothing is applied in this task.
