        - "submit of no text raises ValueError and makes no call"
        - "state of a batch in progress is not ended; state of an ended batch is ended with its end time in UTC; an ended batch without a results location is not readable"
        - "answers gives a label with its tokens for a succeeded valid answer, a None label with tokens for a succeeded refusal or invalid answer, and no result for errored, expired and canceled entries, each under its custom_id"
