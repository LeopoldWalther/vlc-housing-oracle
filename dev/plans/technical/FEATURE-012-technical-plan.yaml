        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/enrichment/__init__.py"
        - "src/enrichment/labeler.py"
        - "src/enrichment/prompt.py"
        - "tests/test_enrichment_labeler.py"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/silver/**"
