    - id: "4.3"
      title: "Deployment, backlog and first runs (operator, with approval)"
      description: |
        Starts only after the integration branch is merged to main through the final PR. Every
        AWS action and every paid run needs explicit user approval in chat, with its upper
        bound.
        1. Wait for the image of the merge commit; set silver_image and the four new variables
           in the gitignored tfvars, labeller_enabled false; terraform plan and apply. Only the
           resources of task 4.1 and a new Silver task definition revision may change.
        2. Confirm that model-invocation logging is off. Start the labeller task by hand for the
           backlog under an approved cap; from its log take the report's counts.
        3. Let the next Silver run write the table. In Athena, as counts only: rows, labelled
           rows, the distribution of both labels, labels on listings that are not a sale (must
           be 0), and the cross table of renovation_state against listing.condition and against
           the keyword strata of task 1.2.
        4. Give the user, privately, the descriptions the model calls an auction although they
           lack the keyword, at most 30 at random; record how many are auctions.
        5. Set labeller_enabled true and apply; record the next triggered run's counts and
           duration, and that a finished labeller started no further task.
        6. Complete the implementation note with the counts, tokens, cost and durations; set the
           feature plan to complete, tick its success criteria, add the progress-log entry and
           update the registry row.
      status: "not_started"
      complexity: "high"
      estimated_hours: 2.0
      depends_on: ["4.2"]
