    - id: "2.2"
      title: "One run, in memory"
      description: |
        label_texts(pending, labeler, *, model_id, max_texts, write_part, now) -> RunReport in
        src/enrichment/text_labels.py. It labels the first max_texts rows of pending one after
        another, collects valid answers as rows of ANSWER_SCHEMA_ARROW with labeled_at from
        now(), and hands every full part of PART_ROWS rows, and the last partial one, to
        write_part(n, table). RunReport is a frozen dataclass of counts: pending, labelled,
        invalid, input_tokens, output_tokens, remaining (pending minus labelled). An invalid
        answer is counted with its tokens and not stored. An exception of the labeller
        propagates after the parts already handed over; the rows collected since the last part
        are written first. check_model(stored, model_id) raises LabelVersionError, naming the
        version and both model ids, when stored answers of LABEL_VERSION carry another model id.
