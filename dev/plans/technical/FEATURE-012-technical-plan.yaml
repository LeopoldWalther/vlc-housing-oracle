    - id: "1.4"
      title: "The Bedrock labeller"
      description: |
        src/enrichment/bedrock.py: BedrockTextLabeler(client, model_id, *, sleep=time.sleep)
        implements TextLabeler with one Converse request per description: modelId, system with
        SYSTEM_PROMPT, one user message holding the description, toolConfig with one tool named
        ANSWER_TOOL_NAME whose input schema is ANSWER_SCHEMA and a toolChoice that forces it, and
        inferenceConfig.maxTokens = MAX_OUTPUT_TOKENS = 200. No temperature or other sampling
        parameter is set. The result is the tool input passed through label_from_answer, with
        the usage's input and output tokens; a response without a tool use gives a None label.
        A ClientError whose code is ThrottlingException is retried after 1, 2 and 4 seconds
        through the injected sleep (four attempts); the fourth and every other error propagate.
        requirements.txt pins boto3 exactly to the version pyiceberg[glue] resolves today.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.3"]
      branch: "feature/text-labels/1.4-bedrock-labeller"
      commit_message: "feat(enrichment): Bedrock text labeller behind the TextLabeler protocol"
      acceptance_criteria:
        - "The request carries the model id, the prompt, the description, the forced tool with ANSWER_SCHEMA and maxTokens 200, and botocore's stub accepts it against the service model"
        - "A valid tool input becomes a LabelResult with the label and the usage's token counts"
        - "A tool input outside the schema and a response without a tool use give a None label with the token counts"
        - "Two throttled attempts and a success give the label after sleeps of 1 and 2 seconds; four throttled attempts raise the ClientError"
        - "Another client error is raised at once, without a sleep"
        - "No test opens a network connection"
      tdd:
        red:
          test_file: "tests/test_enrichment_bedrock.py"
          change: |
            New file. A bedrock-runtime client built with dummy credentials and a fixed region,
            wrapped in botocore.stub.Stubber with expected parameters; a recording sleep.
          command: "python -m unittest tests.test_enrichment_bedrock -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.enrichment.bedrock'"
        green:
          change: "The class, the request, the retry loop and the pin."
          command: "python -m unittest tests.test_enrichment_bedrock -v"
        refactor:
          change: "The request is built by one function; no behavior change."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/enrichment/bedrock.py"
        - "tests/test_enrichment_bedrock.py"
        - "requirements.txt"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/silver/**"
        - "src/synthetic/**"
      can_run_parallel_with: ["1.2"]
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "src/enrichment/bedrock.py"
        - "tests/test_enrichment_bedrock.py"
      files_to_modify:
        - "requirements.txt"

    - id: "1.5"
      title: "The evaluation command"
      description: |
        src/enrichment/evaluate.py: python -m src.enrichment.evaluate --evaluation-set <csv>
        --model-id <id> [--results <csv>], with main(argv, *, labeler=None, clock=time.monotonic)
        so that tests inject a fake labeller. It reads the evaluation set of the conventions,
        refuses a file with a missing column, an unknown state or an is_auction that is neither
        true nor false (exit code 2, naming the row number and the column, never a value),
        labels each description once and prints:
          texts: <n>
          invalid answers: <n>
          input tokens: <n>
          output tokens: <n>
          seconds per text: <x.xx>
          renovation_state agreement: <x.xx>
          <value>: labelled <n>, model <n>, both <n>, precision <x.xx>, recall <x.xx>, weighted precision <x.xx>, weighted recall <x.xx>
        with one <value> line each for renovated, needs_renovation and is_auction. A weighted
        measure weights every text by stratum_population divided by the stratum's texts in the
        file. A measure whose denominator is zero prints n/a. An invalid answer counts as a
        miss for every value. With --results it writes number, the two expected labels and the
        two model labels per text, and no description. Without an injected labeller it builds
        BedrockTextLabeler from a boto3 bedrock-runtime client.
      status: "done"
      complexity: "medium"
      estimated_hours: 2.0
      depends_on: ["1.4"]
      branch: "feature/text-labels/1.5-evaluation-command"
      commit_message: "feat(enrichment): evaluate a labeller against hand labels, weighted by stratum"
      acceptance_criteria:
        - "With a fake labeller that agrees on every text all four measures are 1.00 and agreement is 1.00"
        - "One false positive in a stratum of weight 100 lowers weighted precision far below raw precision, to the values the test computes by hand"
        - "A value with no model answer prints n/a for precision, and one with no hand label n/a for recall"
        - "An invalid answer is counted and lowers recall"
        - "The output contains no description and no row of the file; --results holds numbers and labels only"
        - "A file with a missing column or an unknown label exits 2 and names the row and the column"
      tdd:
        red:
          test_file: "tests/test_enrichment_evaluate.py"
          change: |
            New file. Evaluation sets are written to a temporary directory from invented texts;
            the fake labeller answers from a mapping of description to LabelResult.
          command: "python -m unittest tests.test_enrichment_evaluate -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.enrichment.evaluate'"
        green:
          change: "Reading and checking the file, the loop, the counts per value and the report."
          command: "python -m unittest tests.test_enrichment_evaluate -v"
        refactor:
          change: "The measures are one pure function of counts; no behavior change."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/enrichment/evaluate.py"
        - "tests/test_enrichment_evaluate.py"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/silver/**"
        - "src/synthetic/**"
      can_run_parallel_with: ["1.2"]
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "src/enrichment/evaluate.py"
        - "tests/test_enrichment_evaluate.py"
      files_to_modify: []

    - id: "1.7"
      title: "The Claude API labeller and prompt tl3"
      description: |
        src/enrichment/claude_api.py with MAX_OUTPUT_TOKENS, message_request of the
        conventions, label_result(message) -> LabelResult and ClaudeApiTextLabeler(client,
        model_id), which implements TextLabeler with one client.messages.create call per
        description. label_result takes the tokens from the message's usage and gives a label
        only when the message's stop_reason is "end_turn" and it holds exactly one text block
        whose text is JSON that label_from_answer accepts; blocks are chosen by type, never by
        position, because a response may begin with thinking blocks. Every other response (a
        refusal, the output limit, no text block, two text blocks, text that is not JSON, an
        answer outside the schema) gives a None label with the tokens. An SDK error propagates;
        the client's own bounded retries cover throttling and server errors.
        src/enrichment/prompt.py (review R1): the sentence of SYSTEM_PROMPT that reads
        "... and record two labels with the tool {ANSWER_TOOL_NAME}. Answer only through the
        tool." becomes "... and answer with two labels, renovation_state and is_auction, and
        nothing else."; no other word of the prompt changes, and LABEL_VERSION becomes "tl3".
        The Bedrock request keeps its forced tool and needs no change.
        requirements.txt pins anthropic exactly to the newest release at the time of the task;
        the commit message body names the version.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.3"]
      branch: "feature/text-labels/1.7-claude-api-labeller"
      commit_message: "feat(enrichment): Claude API text labeller with a structured answer, prompt tl3"
      acceptance_criteria:
        - "message_request carries the model id, max_tokens 4096, SYSTEM_PROMPT as system, one user message holding the description and output_config.format with type json_schema and ANSWER_SCHEMA"
        - "message_request has none of the keys temperature, top_p, top_k, thinking, tools and tool_choice, and its output_config has no key but format"
        - "A message with a thinking block before a text block holding a valid answer becomes a LabelResult with the label and the usage's token counts"
        - "A message whose stop_reason is refusal or max_tokens, one without a text block, one with two text blocks, one whose text is not JSON and one whose answer is outside the schema give a None label with the token counts"
        - "ClaudeApiTextLabeler passes exactly message_request's keywords to client.messages.create"
        - "SYSTEM_PROMPT contains neither ANSWER_TOOL_NAME nor the word tool, still names every value of RENOVATION_STATES and every keyword the tests list, and LABEL_VERSION is 'tl3'"
        - "The Bedrock tests pass unchanged; no test opens a network connection or reads ANTHROPIC_API_KEY"
      tdd:
        red:
          test_file: "tests/test_enrichment_claude_api.py"
          change: |
            New file with a fake client whose messages.create records its keyword arguments and
            returns a prepared message (objects with type, text, stop_reason and usage). In
            tests/test_enrichment_labeler.py the version test expects "tl3" and the prompt test
            expects no tool name.
          command: "python -m unittest tests.test_enrichment_claude_api tests.test_enrichment_labeler -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.enrichment.claude_api'"
        green:
          change: "The module, the reworded sentence, the version and the pin."
          command: "python -m unittest tests.test_enrichment_claude_api tests.test_enrichment_labeler tests.test_enrichment_bedrock -v"
        refactor:
          change: "The module docstrings of labeler.py and claude_api.py name both implementations; no behavior change."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
