          command: "python -m unittest tests.test_enrichment_evaluate -v"
        refactor:
          change: "The measures are one pure function of counts; no behavior change."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
