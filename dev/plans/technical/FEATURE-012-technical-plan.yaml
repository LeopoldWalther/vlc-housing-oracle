    - id: "3.2"
      title: "A run given --text-labels writes the table"
      description: |
        In src/silver/rebuild.py: process_landing gains the keyword text_labels: str | None =
        None. When it is given, the run reads the stored answers with stored_answers, reads the
        two column sets from Silver after this run's listings are written and before any label
        rule replaces a temporary table, and writes TEXT_LABEL_TABLE in the existing
        write_silver_tables call of the whole-table labels. Without it the run neither reads
        nor writes the table. main gains --text-labels <dir-or-s3>, and _report prints
        `listing_text_label: snapshot <id>` after the last label line only for a run that wrote
        it.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["3.1"]
      branch: "feature/text-labels/3.2-pipeline"
      commit_message: "feat(silver): write listing_text_label in a run given --text-labels"
      acceptance_criteria:
        - "A backfill with text_labels over answers stored by the command with fake batches writes the table, and every sale listing with a non-empty description carries a label"
        - "Commits processed one at a time with the same stored answers give the rows of that backfill"
        - "A run with text_labels and an empty directory writes the table with null labels"
        - "A run without text_labels writes no such table and every other table as before"
        - "A run with nothing pending writes no snapshot of the table"
        - "The command with --text-labels prints one line `listing_text_label: snapshot <digits>`, and none without it"
      tdd:
        red:
          test_file: "tests/test_silver_incremental.py"
          change: |
            tests/test_silver_incremental.py: a class that stores answers once (backfill, then
            the labeller's main twice with fake batches: one run submits, the next collects)
            and compares a backfill with stepwise runs, both given text_labels. tests/test_silver_cli.py: the report line with and without
            the argument.
          command: "python -m unittest tests.test_silver_incremental tests.test_silver_cli -v"
          expected_failure: "TypeError: process_landing() got an unexpected keyword argument 'text_labels'"
        green:
          change: "The keyword, the reads, the table in the write call, the argument and the report line."
          command: "python -m unittest tests.test_silver_incremental tests.test_silver_cli tests.test_silver_rebuild -v"
        refactor:
          change: "None expected."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/silver/rebuild.py"
        - "tests/test_silver_incremental.py"
        - "tests/test_silver_cli.py"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/synthetic/**"
        - "src/silver/sink.py"
        - "src/silver/sql/**"
        - "src/enrichment/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "src/silver/rebuild.py"
        - "tests/test_silver_incremental.py"
        - "tests/test_silver_cli.py"

    - id: "4.1"
      title: "Infrastructure: the labeller task, its key and its start rule"
      description: |
        infra/silver/labels.tf:
        - a task definition for the labeller on the existing cluster and image, ARM64, 0.25 vCPU
          and 1 GB, with entryPoint ["python", "-m", "src.enrichment.text_labels"] and the
          command --catalog silver --labels s3://<lake bucket>/enrichment/v1/text_label
          --batches s3://<lake bucket>/enrichment/v1/text_label_batch --model-id
          <label_model_id> --max-texts <label_max_texts>, the catalog environment of the Silver
          task, its log group with the stream prefix "labeller", and one secret: the
          environment variable ANTHROPIC_API_KEY from the Parameter Store parameter named by
          label_api_key_parameter. Terraform reads and writes no value of that parameter; the
          user creates it.
        - an execution role of its own that may write the task's log streams and call
          ssm:GetParameters on that one parameter, and nothing else. The parameter uses the
          account's default key for the Parameter Store, which needs no further permission.
        - a task role that may read the Glue database and the Silver table files, and list,
          read and write under enrichment/v1/text_label/ and enrichment/v1/text_label_batch/
          and nowhere else. It has no model permission and no access to the parameter.
        - an EventBridge rule whose pattern is: source aws.ecs, detail-type "ECS Task State
          Change", the cluster's ARN, lastStatus STOPPED, stopCode EssentialContainerExited,
          containers exitCode 0, and group "family:<the Silver task definition's family>"; its
          state follows labeller_enabled; its target runs the labeller task on Fargate with the
          Silver task's network configuration, through a role limited to ecs:RunTask on this
          task definition and iam:PassRole on its two roles.
        infra/silver/variables.tf: label_model_id (string), label_api_key_parameter (string,
        the parameter's name), label_max_texts (number, default 2000) and labeller_enabled
        (bool, default false).
        infra/silver/ecs.tf: the Silver task's command gains --text-labels with the answers'
        location, and its role may list and read that prefix. infra/silver/alerts.tf: the
        failure mail's text says that the task may be the Silver task or the labeller, that
        only the Silver task is retried by the queue, and that the labeller's exit code 1 also
        means a batch without a succeeded request (the credit, the key or the model).
        Nothing is applied in this task.
      status: "done"
      complexity: "high"
      estimated_hours: 2.5
      depends_on: ["3.2"]
      branch: "feature/text-labels/4.1-infrastructure"
      commit_message: "feat(infra): the text labeller task, its key, its roles and its start rule"
      acceptance_criteria:
        - "terraform fmt -check and validate pass"
        - "The start rule's pattern names the Silver task definition's family, so a stopped labeller does not match it"
        - "The labeller's task role names two write prefixes, no model action, no parameter and no wildcard action"
        - "The key appears only as a secret reference by parameter name; no resource or data source reads its value, and only the labeller's execution role may read the parameter"
        - "With labeller_enabled false the rule is disabled"
        - "No account id, bucket name, parameter name or ARN is committed; the new variables have no real default"
      tdd: null
      validation_commands:
        - "terraform -chdir=infra/silver init -backend=false && terraform -chdir=infra/silver fmt -check && terraform -chdir=infra/silver validate"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "infra/silver/labels.tf"
        - "infra/silver/variables.tf"
        - "infra/silver/ecs.tf"
        - "infra/silver/alerts.tf"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/silver/*.tfvars"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "infra/silver/labels.tf"
      files_to_modify:
        - "infra/silver/variables.tf"
        - "infra/silver/ecs.tf"
        - "infra/silver/alerts.tf"

    - id: "4.2"
      title: "Runbook and README"
      description: |
        docs/silver-rebuild.md: a section on text labels with the flow (a Silver run, the
        labeller submits; a later run, the labeller collects; the next Silver run that
        processes a commit writes the table), the lag this gives, including that the answers
        for a week's last commits reach the table with the next landing commit and that a
        manual backfill writes it at once (review R5), the stored layouts of answers and batch
        records, the two commands and their report lines, the cap, the labeller's exit codes,
        what a new LABEL_VERSION means and costs (an open batch of the old version is never
        collected), the label definitions, the reading (a label is the model's reading of the
        description under a version, with the measured precision and recall of the
        implementation note and the size of the sample behind them; null means not labelled or
        not a sale), the key (where it lives, how it is replaced, that it never enters a file
        or a log), the API credit and what happens when it is used up, what the provider keeps
        and for how long, with a link to its retention terms (review R7), how to turn the
        labeller off, and the cost table. The manual backfill's command override names
        --text-labels beside --census-sections. listing_text_label joins "The tables" with the
        note that it exists only for a run given --text-labels. README.md: the status text and
        the architecture bullet name the enrichment input and the table.
      status: "not_started"
      complexity: "low"
      estimated_hours: 0.75
      depends_on: ["4.1"]
      branch: "feature/text-labels/4.2-docs"
      commit_message: "docs(silver): text labels, the labeller and its cost"
      acceptance_criteria:
        - "The runbook states the flow, the layout, the cap, the versioning, the definitions, the reading and the cost"
        - "The README counts the Silver tables correctly"
        - "The leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "docs/silver-rebuild.md"
        - "README.md"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "docs/silver-rebuild.md"
        - "README.md"

    - id: "4.3"
      title: "Deployment, backlog and first runs (operator, with approval)"
      description: |
        Starts only after the integration branch is merged to main through the final PR. Every
        AWS action and every paid run needs explicit user approval in chat, with its upper
        bound.
        1. Wait for the image of the merge commit; set silver_image and the four new variables
           in the gitignored tfvars, labeller_enabled false; terraform plan and apply. Only the
           resources of task 4.1 and a new Silver task definition revision may change.
        2. Start the labeller task by hand with a cap of one text. When its batch has ended,
           start it again: the run must collect one valid answer. This proves the key, the
           network route and the organization's limits from the deployed task.
        3. Start the labeller by hand for the backlog under an approved cap, and again after
           each batch has ended, until nothing is pending; from the logs take the reports'
           counts.
        4. Let a Silver run write the table: the next run that processes a landing commit, or,
           with approval, the manual backfill of the runbook. In Athena, as counts only: rows,
           labelled rows, the distribution of both labels, labels on listings that are not a
           sale (must be 0), and the cross table of renovation_state against listing.condition
           and against the keyword strata of task 1.2.
        5. Give the user, privately, the descriptions the model calls an auction although they
           lack the keyword, at most 30 at random; record how many are auctions.
        6. Set labeller_enabled true and apply; record the counts and durations of the next two
           triggered runs (one submits, one collects), and that a finished labeller started no
           further task.
        7. Complete the implementation note with the counts, tokens, credit used and durations;
           set the feature plan to complete, tick its success criteria, add the progress-log
           entry and update the registry row.
      status: "not_started"
      complexity: "high"
      estimated_hours: 2.5
      depends_on: ["4.2"]
      branch: "feature/text-labels/4.3-first-run-record"
      commit_message: "docs(plans): FEATURE-012 backlog, first runs and label counts"
      acceptance_criteria:
        - "Every sale listing with a non-empty description is labelled or counted as pending, invalid, errored or expired"
        - "No listing that is not a sale carries a label"
        - "The credit used by the backlog and the tokens are recorded and lie under the approved bound"
        - "The share of true auctions among the model's auctions without the keyword is recorded"
        - "A finished labeller task started no further labeller task"
        - "The note holds counts only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-012-text-labels.md"
        - "dev/plans/FEATURE-012-text-labels.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-012-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Set labeller_enabled false and apply; remove --text-labels by setting silver_image back and applying; drop the Silver table listing_text_label; the stored answers and records may stay; revoke the key in the Console if it is no longer used"
      files_to_create: []
      files_to_modify:
        - "dev/plans/implementations/FEATURE-012-text-labels.md"
        - "dev/plans/FEATURE-012-text-labels.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-012-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/text-labels/integration"
    task_branch_strategy: |
      The integration branch exists and holds tasks 1.1 to 1.5 and the two records of task 1.6.
      The amendment of 2026-11-20 (the feature plan, ADR 0005, the review, the registry row and
      this file) is committed to the integration branch as one docs commit, after the user's
      approval, before task 1.7 starts. Each task branch starts from the integration branch
      after the tasks it depends on are merged there. Tasks 1.8 and 1.9 may run beside each
      other; every other task runs alone. Before task 3.1, main is merged into the integration
      branch with --no-ff (CLAUDE.md may conflict: keep main's text and the enrichment entry).
      Task 4.3 starts from main after the final PR is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.7, 1.8, 1.9, 1.6, 2.1, 2.2, 2.3, 3.1, 3.2, 4.1, 4.2, never
      rewriting history, and run validation.final_commands there. The final PR goes from the
      integration branch to main. Task 4.3's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): renovation state and auctions read from the description by a model"
    final_pr_description: |
      Implements FEATURE-012: a labeller command sends the redacted sale descriptions to a
      Claude model as a message batch, collects the answers in a later run and stores them as
      an immutable input, and a Silver run given --text-labels writes listing_text_label from
      them. See dev/reviews/REVIEW-FEATURE-012.md (approved, re-reviewed 2026-11-20) and ADR
      0005. Nothing is applied by this PR; task 4.3 deploys with approval.

  notes:
    - "Never print, log or commit a description, a hash or a listing id; every record is counts. The evaluation set and its results stay in a private directory outside the repository."
    - "Only the description leaves Silver. The title is not redacted and names a street."
    - "Every paid run needs the user's approval with an upper bound: each run of task 1.6 and each run of task 4.3. Claude Haiku 5.5 comes first; Claude Sonnet 5.5 is evaluated only if renovated fails."
    - "The API key never passes through the chat, an argument, a file, a fixture, a commit or a log. The user writes it to the Parameter Store; a command gets it as ANTHROPIC_API_KEY in its environment only."
    - "Load the claude-api skill before writing src/enrichment/claude_api.py: model ids, the structured output and the batch calls come from its files and from the pinned SDK's types. If a name in this plan differs from the SDK's, the SDK's is used and the commit message says so."
    - "Do not set a sampling parameter, a thinking setting or a forced tool choice in the Claude API request: the candidate models reject them. The Bedrock request is not changed."
    - "If the provider rejects the structured output or the output limit for a candidate model, or a batch refuses the request of task 1.7, stop and return to the reviewer; do not work around it in an operator run."
    - "The model id is configuration: a task argument and gitignored tfvars, never a default in the repository. The parameter's name is configuration too."
    - "infra/silver/*.tfvars hold real values and are gitignored: never stage, print or commit them."
    - "The start rule must name the Silver task definition's family. A rule on the cluster alone starts the labeller from the labeller."
    - "Read the columns the text labels need from Silver before listing_quality(), listing_events() or listing_prices() is called: each replaces temporary tables the fallback read uses."
    - "A changed prompt, schema or model is a new LABEL_VERSION; the evaluation is repeated for it before the backlog is labelled again."
    - "A text whose request fails every time is submitted again by every run. The report counts it; it is accepted because one text costs a fraction of a cent a run."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
