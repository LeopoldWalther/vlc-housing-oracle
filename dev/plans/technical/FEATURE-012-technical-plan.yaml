    - id: "2.3"
      title: "The command, the stored parts and the batch records"
      description: |
        In src/enrichment/text_labels.py:
        - stored_answers(connection, labels) -> pyarrow.Table reads every part under <labels>
          with the columns of ANSWER_SCHEMA_ARROW and returns an empty table of that schema when
          no part exists; a part that lacks a column raises StoredAnswerError naming the part's
          path below <labels> and the column.
        - open_batches(labels, batches) -> list[BatchRecord] reads the records of LABEL_VERSION
          under <batches> and leaves out every batch whose part exists under <labels>; the
          part's existence is read from the file listing, because a part may hold no row.
        - part_writer(labels) and record_writer(batches) return the write_part and write_record
          of the conventions' layouts through pyarrow.fs.FileSystem.from_uri; neither replaces
          an existing file.
        - main(argv, *, batches=None, now=...) is python -m src.enrichment.text_labels --catalog
          <name> --labels <dir-or-s3> --batches <dir-or-s3> --model-id <id> --max-texts <n>.
          Without injected batches it builds ClaudeApiBatches from anthropic.Anthropic() and
          --model-id, and exits 1 naming the variable when ANTHROPIC_API_KEY is not set. It
          reads the stored answers and runs check_model, collects the open batches, reads the
          stored answers and the open batches again, takes the pending texts from Silver's
          listing and listing_text through the catalog, submits them, and prints, one per line:
          "batches collected", "batches open", "labelled", "invalid answers", "errored
          requests", "expired requests", "input tokens", "output tokens", "pending",
          "submitted" and "remaining", each followed by a colon and its count.
          Exit code 0 on success; 1 after all of the above when failed_batches is not 0
          (message "a collected batch had no succeeded request"), and for LabelVersionError,
          StoredAnswerError, BatchResultError and the missing key (message without a value); 2
          for usage. For an s3:// location the session reads through httpfs as the Silver
          command does.
