    - id: "1.9"
      title: "The Claude API batches"
      description: |
        src/enrichment/batches.py, which knows no service:
          BatchState(ended, ended_at, readable)     frozen dataclass; ended_at is a UTC datetime
                                                    or None; readable is False when the batch
                                                    has ended and its results can no longer be
                                                    read
          BatchAnswer(text_sha256, outcome, result) frozen dataclass; outcome is one of
                                                    succeeded, errored, expired, canceled;
                                                    result is a LabelResult for succeeded and
                                                    None otherwise
          TextLabelBatches                          Protocol with
                                                    submit(texts) -> str, where texts is a
                                                    sequence of (text_sha256, description) and
                                                    the result is the batch id;
                                                    state(batch_id) -> BatchState;
                                                    answers(batch_id) -> Iterator[BatchAnswer]
        ClaudeApiBatches(client, model_id) in src/enrichment/claude_api.py implements it:
        submit sends one client.messages.batches.create call whose requests each carry the
        text's hash as custom_id and message_request(model_id, description) as params, and
        refuses an empty sequence with ValueError; state reads client.messages.batches.retrieve
        (ended when processing_status is "ended"); answers iterates
        client.messages.batches.results and turns a succeeded entry's message into a
        LabelResult with label_result of task 1.7. Results arrive in any order and are keyed by
        custom_id only.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.7"]
