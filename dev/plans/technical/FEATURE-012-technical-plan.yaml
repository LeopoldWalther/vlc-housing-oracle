        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/enrichment/evaluate.py"
        - "tests/test_enrichment_evaluate.py"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/silver/**"
        - "src/synthetic/**"
      can_run_parallel_with: ["1.2"]
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "src/enrichment/evaluate.py"
        - "tests/test_enrichment_evaluate.py"
      files_to_modify: []

    - id: "1.6"
      title: "Paid evaluation and gate (operator, with approval)"
      description: |
        Needs tasks 1.2 and 1.5 and the user's approval of the paid run and its upper bound.
        1. Read the current Bedrock price of the model and the id of its inference profile in
           the account; confirm that model-invocation logging is off.
        2. Run the evaluation command once against the private evaluation set, with --results
           into the private directory.
        3. Record in the implementation note, as counts only: the report's lines, the price, the
           cost of the run, and the estimated cost of the backlog and of a month from the
           measured tokens.
        4. Gate: renovated, needs_renovation and is_auction each need a weighted precision of
           at least 0.90 and a weighted recall of at least 0.80. The user reads the
           disagreements in the private results file. If a value fails, the user decides between
           dropping the label and a larger model for it; that decision and a changed prompt are
           a new LABEL_VERSION and a new run, and a dropped label returns the plan to the
           reviewer before phase 2.
        5. Add the progress-log entry to the feature plan.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.0
      depends_on: ["1.2", "1.5"]
      branch: "feature/text-labels/1.6-evaluation-record"
      commit_message: "docs(plans): FEATURE-012 evaluation of the model against hand labels"
      acceptance_criteria:
        - "The implementation note records the measures per decisive value, the tokens, the price and the cost"
        - "The gate's result and the user's decision are recorded"
        - "The note holds counts only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
