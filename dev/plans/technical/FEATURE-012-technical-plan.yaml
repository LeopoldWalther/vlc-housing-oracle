    - id: "2.2"
      title: "Collect and submit, in memory"
      description: |
        In src/enrichment/text_labels.py, with a fake TextLabelBatches in the tests:
        - BatchRecord(batch_id, model_id, text_sha256s), a frozen dataclass.
        - collect_batches(open_batches, batches, *, write_part) -> CollectReport. For each open
          batch in the order of its id: a batch that has not ended is left alone; an ended
          batch that is not readable gets write_part(batch_id, <no row>); an ended, readable
          batch has its answers read, and write_part(batch_id, table) receives one row of
          ANSWER_SCHEMA_ARROW per succeeded answer with a label, ordered by text_sha256, with
          LABEL_VERSION, the record's model id and the batch's end as labeled_at, also when no
          row results. An answer whose text_sha256 is not in the record raises
          BatchResultError naming the batch id and no hash, before anything of that batch is
          written. CollectReport is a frozen dataclass of counts: collected, still_open,
          labelled, invalid (succeeded without a label), errored, expired (expired and
          canceled), input_tokens, output_tokens and failed_batches (collected batches that
          held at least one request and no succeeded one; review R4).
        - submit_pending(pending, batches, *, model_id, max_texts, write_record, now) ->
          SubmitReport. It submits the first max_texts rows of pending as one batch and then
          hands write_record(batch_id, table) the record of BATCH_RECORD_SCHEMA_ARROW with
          submitted_at from now(); with nothing pending it calls neither. SubmitReport is a
          frozen dataclass of counts: pending, submitted and remaining. An exception of
          submit propagates and no record is written.
        - check_model(stored, model_id) raises LabelVersionError, naming the version and both
          model ids, when stored answers of LABEL_VERSION carry another model id.
        Neither function waits or sleeps.
      status: "done"
      complexity: "medium"
      estimated_hours: 2.0
      depends_on: ["2.1", "1.9"]
      branch: "feature/text-labels/2.2-collect-and-submit"
      commit_message: "feat(enrichment): collect ended batches and submit pending texts under a cap"
      acceptance_criteria:
        - "An ended batch of three texts with two valid answers and one invalid gives one part of two rows ordered by text_sha256 and a report of 1 collected, 2 labelled, 1 invalid with the tokens of all three"
        - "A batch that has not ended gets no part and no answers call and is counted as still open"
        - "Errored, expired and canceled requests are counted, are in no part, and a batch holding only such requests gets a part without a row and counts as a failed batch"
        - "An ended batch that is not readable gets a part without a row"
        - "Every stored row carries LABEL_VERSION, the record's model id and the batch's end, whatever model id the run was started with"
        - "An answer for a hash outside the record raises BatchResultError and writes nothing of that batch"
        - "450 pending texts under a cap of 300 submit the first 300 in the order of pending as one batch, write one record of 300 rows and report 150 remaining"
        - "Nothing pending makes no submit call and writes no record; a submit that raises writes no record"
        - "check_model raises for another model id under the same version and passes for the same id, for another version and for no stored answer"
      tdd:
        red:
          test_file: "tests/test_enrichment_text_labels.py"
          change: "Add fake batches (prepared states and answers, recorded submits), recording write_part and write_record, and the cases of the acceptance criteria."
          command: "python -m unittest tests.test_enrichment_text_labels -v"
          expected_failure: "ImportError: cannot import name 'collect_batches' from 'src.enrichment.text_labels'"
        green:
          change: "The two functions, their reports, the record type and check_model."
          command: "python -m unittest tests.test_enrichment_text_labels -v"
        refactor:
          change: "None expected."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
