        - "It returns None for an unknown state, a missing key, an extra key, a non-boolean is_auction (0, 1, 'true') and a value that is not a mapping"
        - "ANSWER_SCHEMA's enum equals RENOVATION_STATES and both properties are required"
        - "SYSTEM_PROMPT names every value of RENOVATION_STATES; LABEL_VERSION is 'tl1'"
