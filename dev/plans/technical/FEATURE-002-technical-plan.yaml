    - id: "2.1"
      title: "The table is written in both modes"
      description: |
        Append "listing_event" to SILVER_TABLES, so build_tables computes it over every run (the
        oracle of the equality tests). In process_landing, after listing and listing_text are
        written and before record_ingested, in both modes: scan Silver's walk (the eight columns
        of the conventions) and observation (the six columns) at their current snapshots from the
        catalog, call listing_events, and overwrite the table with write_silver_tables using the
        run's snapshot properties; add its snapshot id to ProcessResult.snapshot_ids. The events
        function must run after _compute_listings, which replaces the temporary table
        silver_observation with a subset. With nothing pending, nothing is written.
      status: "not_started"
      complexity: "high"
      estimated_hours: 2.0
      depends_on: ["1.4"]
      branch: "feature/listing-event/2.1-pipeline"
      commit_message: "feat(silver): maintain listing_event in every run"
      acceptance_criteria:
        - "A backfill writes listing_event with at least one row on the synthetic landing, equal to the rule over every run"
        - "One commit at a time, three at a time and all at once give the same listing_event rows as a backfill"
        - "A run interrupted before the ingest log and repeated gives the same rows"
        - "A late run that adds a sighting inside a gap removes the disappeared event; the table equals a backfill"
        - "Tables that predate the feature: after some commits, listing_event is dropped; processing the rest recreates it equal to a backfill, and every other table's schema is unchanged"
        - "Nothing pending writes no snapshot to listing_event"
        - "The table's snapshot summary carries the same properties as the other tables"
      tdd:
