        - "tests/test_silver_listing_event.py"

    - id: "1.3"
      title: "A return, and more than one gap"
      description: |
        Add the reappeared branch: when a gap that holds a disappeared event ends in a sighting,
        emit reappeared on that sighting's day with its area and run_id and the gap's
        last_seen_date.
      status: "done"
      complexity: "low"
      estimated_hours: 0.75
      depends_on: ["1.2"]
      branch: "feature/listing-event/1.3-reappeared"
      commit_message: "feat(silver): a listing reappears at its first sighting after a disappearance"
      acceptance_criteria:
        - "Seen day 1, missed by a complete walk day 3, seen day 5: disappeared (day 3) and reappeared (day 5, the day-5 sighting's area and run_id, last_seen_date day 1)"
        - "Two such gaps yield four events"
        - "A gap without an evidence day yields neither event, although the listing was seen again"
        - "After the latest real card moved from area A to area B, a complete walk of A is no evidence and one of B is"
      tdd:
        red:
          test_file: "tests/test_silver_listing_event.py"
          change: "The four cases of the acceptance criteria."
          command: "python -m unittest tests.test_silver_listing_event -v"
          expected_failure: "The cases expecting a reappeared row fail: the statement returns only disappeared rows."
        green:
