            listing_event.sql with the sighting, evidence and gap expressions and the disappeared
            SELECT; listing_events() as described in the conventions.
          command: "python -m unittest tests.test_silver_listing_event -v"
        refactor:
          change: "Name the common table expressions sighting, evidence and gap; header comment states the rule."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
