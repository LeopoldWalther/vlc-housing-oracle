      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "src/silver/rebuild.py"
        - "tests/test_silver_cli.py"

    - id: "3.1"
      title: "Runbook and README"
      description: |
        docs/silver-rebuild.md: add listing_event to "The tables" (one row per event; the rule in
        two sentences; event_date is when the absence was noticed, the listing left between
        last_seen_date and event_date; no event means nobody looked; a late run can retract an
        event; the table is recomputed and replaced whole in every run, and why); add the line
