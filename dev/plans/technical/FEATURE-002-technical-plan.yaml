          test_file: "tests/test_silver_incremental.py"
          change: |
            Append "listing_event" to SILVER_TABLES in src/silver/rebuild.py first: this is the
            RED change for the existing equality and backfill tests. Add to
            tests/test_silver_listing_event.py a class on a SQLite catalog with hand-written
            landing (write_landing_v3) for the retraction case, and to
            tests/test_silver_incremental.py the pre-feature-tables case.
          command: "python -m unittest tests.test_silver_incremental tests.test_silver_rebuild tests.test_silver_listing_event -v"
          expected_failure: |
            tests/test_silver_rebuild.py::test_every_table_is_committed_and_its_snapshot_holds_its_rows
            fails on the set comparison (listing_event missing from snapshot_ids);
            tests/test_silver_incremental.py fails with NoSuchTableError for
            vlc_housing_silver.listing_event; the new retraction and pre-feature cases fail the
            same way.
        green:
          change: "The catalog scan, the listing_events call and the overwrite in process_landing, as described."
          command: "python -m unittest tests.test_silver_incremental tests.test_silver_rebuild tests.test_silver_listing_event tests.test_silver_listing_incremental -v"
        refactor:
          change: "One private function for 'events from the catalog'; no duplicated column lists between the scan and the conventions."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
