  conventions: |
    - The rule, per source (feature plan, Design):
        sighting      = a row of Silver observation; an empty card counts as seen.
        home area     = the area of the listing's latest sighting up to that day with
                        is_empty_card false; none if there is no such sighting.
        evidence day  = (area, observed_date) with at least one walk that is complete, has
                        is_replay false (null is not false), and whose run_started_at and
                        run_ended_at fall on the same UTC date.
        gap           = from a sighting's day to the listing's next sighting, open-ended without one.
        disappeared   = the first evidence day of the sighting's home area strictly inside the gap.
        reappeared    = the next sighting's day, when the gap holds a disappeared event.
    - Columns of listing_event, in this order: source, source_listing_id, event_type, event_date,
      area, run_id, last_seen_date, transformation_version.
        disappeared: area = home area; run_id = the complete live run of that area on event_date
                     with the earliest run_started_at.
        reappeared:  area and run_id = those of the sighting that ends the gap.
        last_seen_date = the sighting that opens the gap, for both types.
      Rows are ordered by source, source_listing_id, event_date, event_type.
    - The statement lives in src/silver/sql/listing_event.sql and reads the temporary tables
      silver_walk and silver_observation, like the existing statements.
    - listing_events(connection, walk, observation) -> pyarrow.Table in src/silver/rebuild.py is
      the one public entry point: it prepares the session (UTC, variables), replaces silver_walk
      and silver_observation with the given Arrow tables, and runs the statement. It needs only
      these columns: walk (source, area, observed_date, run_id, run_started_at, run_ended_at,
      complete, is_replay); observation (source, source_listing_id, observed_date, area,
      is_empty_card, run_id).
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table, column or test expectation
      about other tables changes.
    - Tests use synthetic values only (source "syn", invented areas) and compare results as Arrow
      rows (to_arrow_table().to_pylist()), never through fetchall (review L2).
    - All repository artifacts are in English.

  tasks:
    - id: "1.1"
      title: "A disappearance"
      description: |
        Create src/silver/sql/listing_event.sql and listing_events() in src/silver/rebuild.py.
        The statement finds, for each sighting, the first evidence day of its area inside the
        gap to the next sighting and returns one disappeared row. At this stage the area is the
        sighting's own area and an evidence day is any complete, non-replay walk; 1.2 adds the
        remaining conditions. Do not add listing_event to SILVER_TABLES (review M1).
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: []
      branch: "feature/listing-event/1.1-disappeared"
      commit_message: "feat(silver): a listing disappears at the first complete walk that misses it"
      acceptance_criteria:
        - "A listing seen in an area on day 1 and missed by a complete live walk of that area on day 3 yields exactly one row: disappeared, event_date day 3, that area, the walk's run_id, last_seen_date day 1, transformation_version silver-v1"
        - "A listing seen on day 1 and day 3 with no walk between yields no row"
        - "The existing suite is unchanged and green"
      tdd:
