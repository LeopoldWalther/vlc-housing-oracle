        Add the evidence filters and the home-area rule: is_replay must be false, null complete
        or is_replay never counts, the run must start and end on one UTC date, the walk must be
        of the home area and strictly after the sighting; the home area is the area of the
        latest non-empty sighting; an empty-card sighting still closes a gap.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.0
      depends_on: ["1.1"]
      branch: "feature/listing-event/1.2-not-evidence"
      commit_message: "feat(silver): only complete live walks of a listing's own area are evidence"
      acceptance_criteria:
        - "No event from: an incomplete walk; a replay; a walk with null complete and is_replay; a walk of another area; a walk on the sighting's day or earlier; a walk whose run ends on the next UTC date"
        - "A listing only ever seen as an empty card yields no event"
        - "A listing seen as a real card in area A, then only as an empty card in area B, is judged by A's walks"
        - "An empty-card sighting between two walks closes the gap: no event dated after it for the earlier sighting"
      tdd:
        red:
          test_file: "tests/test_silver_listing_event.py"
          change: "One test per case of the acceptance criteria, each a subTest or its own method."
          command: "python -m unittest tests.test_silver_listing_event -v"
          expected_failure: |
            The replay, null, midnight, empty-card-only and home-area cases fail: the 1.1 statement
            returns a disappeared row where none is expected. The incomplete-walk, other-area and
            same-day cases may already pass and stay as guards.
        green:
          change: "The WHERE of the evidence expression and the home_area window in listing_event.sql."
          command: "python -m unittest tests.test_silver_listing_event -v"
        refactor:
          change: "None expected beyond keeping each condition on its own line with the reason in the header comment."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
