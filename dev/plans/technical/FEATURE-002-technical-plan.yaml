        - "Two complete live walks of the area on the evidence day: run_id is the run that started earlier, whatever the run_id strings' order"
        - "Rows are ordered by source, source_listing_id, event_date, event_type, and (source, source_listing_id, event_type, event_date) is unique"
        - "Empty walk and observation tables give zero rows with the eight columns and their types"
      tdd:
