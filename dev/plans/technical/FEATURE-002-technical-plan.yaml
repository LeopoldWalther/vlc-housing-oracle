    - id: "3.2"
      title: "First real run and implementation note (operator)"
      description: |
        Starts only after the integration branch is merged to main through the final PR.
        1. Wait for GitHub Actions to publish the image of the merge commit (tag = SHA).
        2. In the operator's local, gitignored infra/silver/silver.auto.tfvars set silver_image
           to that tag; terraform apply in infra/silver. Only a new task definition revision and
           the consumer's reference to it may change. Never stage, print or commit the file.
        3. Let the next landing commit or the 05:30 UTC catch-up start a task. No backfill.
           From the task log take the listing_event snapshot id and the task's duration, and
           compare the duration with the tasks before the change.
        4. In Athena, privately and as counts only: count listing_event rows per event_type at
           that snapshot, and count the same rule written in Athena SQL over the walk and
           observation snapshots of the same run (window functions with IGNORE NULLS, the
           evidence filter with date(run_ended_at) = date(run_started_at), the first evidence day
           per gap). The two pairs of counts must be equal. No row is returned or saved.
        5. Write dev/plans/implementations/FEATURE-002-listing-event.md with the counts, the
           snapshot date and the durations; set the feature plan to complete, tick its success
           criteria, add the progress-log entry and update the registry row.
        Every AWS action needs explicit user approval in chat.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.25
      depends_on: ["3.1"]
      branch: "feature/listing-event/3.2-first-run-record"
      commit_message: "docs(plans): FEATURE-002 first run and event counts"
      acceptance_criteria:
        - "A Silver task after the deployment exits 0 and prints a listing_event snapshot"
        - "Counts per event_type in listing_event equal the Athena implementation of the rule on the same snapshots"
        - "The task duration before and after is recorded"
        - "The note holds counts only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-002-listing-event.md"
        - "dev/plans/FEATURE-002-listing-event.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-002-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Set silver_image back to the previous tag and apply; drop vlc_housing_silver.listing_event; revert the commit"
      files_to_create:
        - "dev/plans/implementations/FEATURE-002-listing-event.md"
      files_to_modify:
        - "dev/plans/FEATURE-002-listing-event.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-002-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/listing-event/integration"
    task_branch_strategy: |
      Create the integration branch from main and commit the feature plan, the review, this file
      and the FEATURE-002 registry row there first (only FEATURE-002's artifacts; FEATURE-007's
      files in the same working tree belong to its own branch). Task 1.1 starts from the
      integration branch; each later task of phases 1 to 3.1 starts from the integration branch
      after its predecessor is merged. The tasks share listing_event.sql, rebuild.py and one test
      file, so none runs in parallel. Task 3.2 starts from main after the final PR is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 1.3, 1.4, 2.1, 2.2, 3.1, never rewriting history, and
      run validation.final_commands there. The final PR goes from the integration branch to
      main. Task 3.2's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "docs", "chore"]
