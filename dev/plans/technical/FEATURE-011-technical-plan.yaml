  notes:
    - "The real boundary file never enters the repository, a fixture or a test. Tests use the synthetic archive."
    - "Never print, log or commit a real listing id or coordinate; task 3.4 outputs counts only."
    - "infra/silver/*.tfvars hold real values and are gitignored: only silver_image and census_sections change, by the operator, in task 3.4."
    - "Longitude is x. Every ST_Transform carries always_xy := true and every point is ST_Point(longitude, latitude); a swap gives null codes for every listing and no error."
    - "The archive's root is not readable through /vsizip/: the path must name the inner .shp, which lies in a sub-folder with a non-ASCII name in the real file."
    - "The file is read and checked before the first write of a run, not when the table is computed."
    - "Read the columns this rule needs from Silver in the single listing read, before listing_quality() replaces the temporary table silver_listing."
