    - id: "3.4"
      title: "First vintage, deployment and first run (operator, with approval)"
      description: |
        Starts only after the integration branch is merged to main through the final PR. Every
        AWS action needs explicit user approval in chat.
        1. Download the 2026 edition; convert it for province 46 with the vintage 2026-01-01
           into a local directory; check the manifest (1,841 rows expected).
        2. Upload the vintage directory to reference/v1/census_sections/ of the lake bucket.
        3. Wait for the image of the merge commit; set silver_image and census_sections in the
           gitignored tfvars; terraform plan and apply. Only the task role's policy and a new
           task definition revision may change.
        4. Let the next landing commit or the catch-up start a task. No backfill. From the task
           log take the snapshot id and the duration, and compare it with the durations recorded
           for FEATURE-010.
