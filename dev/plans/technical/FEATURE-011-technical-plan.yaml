  conventions: |
    - DuckDB's spatial extension is installed once per environment by
      python -c "import duckdb; duckdb.sql('INSTALL spatial')" (CI, the README and the image do
      it). Code that needs it runs LOAD spatial on its session; nothing installs it at run time,
      and no test skips when it is missing.
    - The statistics office's shapefile has, among others, the text fields CUSEC (section, 10
      digits), CUDIS (district, 7), CUMUN (municipality, 5), CPRO (province, 2) and NMUN
      (municipality name), and polygons or multipolygons in a projected system. These five names
      are constants of the converter.
    - Every reprojection is ST_Transform(geometry, <source>, 'EPSG:4326', always_xy := true):
      longitude is x and latitude is y everywhere, and a point is ST_Point(longitude, latitude).
    - A reference vintage is the directory <out>/census_sections/vintage=<vintage>/ with
      part-0.parquet and _manifest.json. The Parquet columns, in order, ordered by section_code:
        section_code        string   10 digits
        district_code       string   7 digits
        municipality_code   string   5 digits
        municipality_name   string
        geometry            binary   WKB, EPSG:4326, longitude before latitude
        vintage             string   the same value on every row
      The manifest is a JSON object with dataset ("census_sections"), vintage, source, licence,
      retrieved, archive_sha256, province, crs and rows. A vintage directory is written once; an
      existing one is refused.
    - The Silver table listing_location: one row per listing with a detail record
      (detail_observed_at is not null), ordered by source, source_listing_id. Columns, in order,
      with Arrow types:
        source                   string
        source_listing_id        string
        municipality_code        string   null without coordinates or outside every polygon
        district_code            string   as municipality_code
        section_code             string   as municipality_code
        reference_vintage        string   never null
        transformation_version   string
      A listing belongs to a polygon when ST_Intersects(polygon, point) holds, so a point on a
      border belongs; of several polygons the one with the smallest section_code is taken, and
      the three codes come from that one polygon.
    - LOCATION_TABLE = "listing_location" is a constant of src/silver/rebuild.py and is not a
      member of SILVER_TABLES: it exists only for a run given --census-sections.
      LOCATION_LISTING_COLUMNS are source, source_listing_id, detail_observed_at, latitude and
      longitude.
    - --census-sections names a vintage directory, local or s3://. A run given it reads
      part-0.parquet and checks it before its first write: readable, the six columns, at least
      one row, exactly one vintage. A failed check raises ReferenceDataError, whose message
      names the path and what is wrong and holds no row value; the command exits 1 and the runs
      stay pending.
    - A new vintage changes rows without a new transformation_version: the input changed, not
      the rule.
    - Synthetic reference data uses the province codes 99 and 98, which no real province has,
      and invented municipality names. The real boundary file never enters the repository, a
      fixture or a test.
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table, column or test expectation
      about other tables changes.
    - All repository artifacts are in English.

