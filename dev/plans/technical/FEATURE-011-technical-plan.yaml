    - id: "1.3"
      title: "The converter"
      description: |
        src/reference/census_sections.py: convert(archive, *, province, crs, vintage, source,
        licence, retrieved, out) and main(argv) as python -m src.reference.census_sections
        --archive <zip> --province <2 digits> --crs <EPSG code> --vintage <date> --source <url>
        --licence <text> --retrieved <date> --out <dir>, all required. It finds the one .shp in
        the archive, reads it in place through /vsizip/<archive>/<inner path>, keeps the rows of
        the province, reprojects from --crs with longitude first, and writes the vintage
        directory of the conventions with the manifest; archive_sha256 is the SHA-256 of the
        archive file. It refuses, with exit code 2 and a message that names the cause: an
        existing vintage directory, an archive with no or several .shp files, a shapefile that
        lacks one of the five fields (naming it), a province without a row, and a section code
        that occurs twice. No code touches the network.
