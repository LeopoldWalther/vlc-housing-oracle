  conventions: |
    - A wording is feature_wording(feature), a temporary SQL macro defined in
      src/silver/sql/feature_wording.sql:
        lower(regexp_replace(trim(feature), '[0-9]+([.,][0-9]+)*', '#', 'g'))
      The 'g' option is required: without it DuckDB replaces the first number only.
    - src/silver/feature_patterns.py holds the registry and nothing else that has behavior:
        KNOWN_PATTERNS          dict of wording -> target, the 99 entries of `registry` below
        KNOWN_PATTERN_DIGESTS   dict of SHA-256 hex -> target, the one entry of `registry_digests`
        FURNISHING_VALUES       dict of wording -> furnished | kitchen_only | unfurnished
        LABEL_TARGETS           ("is_tenant_occupied", "is_bare_ownership", "furnishing")
        UNREAD                  "unread"
        registry_rows() -> pyarrow.Table with pattern_sha256 (string), target (string) and
                           label_value (string, null except for the furnishing wordings)
        register_feature_registry(connection)
                           runs feature_wording.sql and replaces the temporary table
                           feature_registry with registry_rows(); _prepare() calls it
      A digest is hashlib.sha256 of the wording's UTF-8 bytes as lower-case hex, which equals
      DuckDB's sha256(); the statements join on sha256(pattern) = pattern_sha256.
    - A target is a column of listing_detail in contracts/landing/v3/schema.json (these are the
      attribute columns of Silver's listing), one of LABEL_TARGETS, or UNREAD.
    - The wording that is listed by digest is never written in clear in the repository: not in
      code, tests, fixtures, documentation or plans. The leak guard refuses one of its words.
    - The table feature_pattern: one row per wording seen in Silver's listing_text.features,
      ordered by listings descending, then pattern. Columns, in order, with Arrow types:
        pattern                    string
        listings                   int32     distinct listings (source, source_listing_id)
                                             with the wording
        target                     string    null for a wording that is not in the registry
        listings_target_missing    int32     of those listings, the ones whose target column
                                             is missing; null when the target is null, a label
                                             or UNREAD
        transformation_version     string
      A column is missing for a listing when its value, cast to VARCHAR, is null, 'unknown' or
      '[]'. The statement unpivots every column of silver_listing except the two key columns
      with nulls included, so no column name is written into SQL.
    - The table listing_feature_label: one row per row of listing_text, ordered by source,
      source_listing_id. Columns, in order, with Arrow types:
        source                    string
        source_listing_id         string
        is_tenant_occupied        bool      never null
        is_bare_ownership         bool      never null
        furnishing                string    furnished, kitchen_only, unfurnished; null when no
                                            wording states it or two wordings state different
                                            values
        transformation_version    string
      The labels do not depend on the listing's operation.
    - Both statements read the temporary tables silver_listing_text (source, source_listing_id,
      features) and feature_registry; feature_pattern.sql also reads silver_listing with every
      column. feature_patterns(connection, listing, listing_text) and
      listing_feature_labels(connection, listing_text) in src/silver/rebuild.py are the public
      entry points, after the pattern of listing_quality(): each prepares the session, replaces
      the temporary tables it reads with the given Arrow tables and runs its statement.
    - From task 3.1 on, feature_pattern and listing_feature_label are members of SILVER_TABLES,
      directly after listing_text. process_landing reads Silver's whole listing (every column)
      and listing_text (source, source_listing_id, features) once, before any label rule runs,
      and passes each rule its columns.
    - The run's count of unknown wordings is the number of rows of feature_pattern with a null
      target. It is ProcessResult.unknown_feature_patterns, printed as `unknown feature
      patterns: <n>` and, with --metrics, published as UnknownFeaturePatterns (Unit Count) in
      the namespace of PendingRuns. A run with nothing pending prints and publishes neither.
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table or column changes.
    - Tests use synthetic values only (source "syn") and compare results as Arrow rows
      (to_pylist()). Feature strings in tests are wordings of the registry or invented ones.
    - All repository artifacts are in English; the wordings are Spanish as the portal writes
      them.

