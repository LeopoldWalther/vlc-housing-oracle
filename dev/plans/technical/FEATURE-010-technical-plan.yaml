        src/silver/rebuild.py: ProcessResult gains unknown_feature_patterns (int); _report
        prints `feature_pattern: snapshot <id>` and `listing_feature_label: snapshot <id>` after
        the listing_price line and then `unknown feature patterns: <n>`; with --metrics a run
        that processed something publishes UnknownFeaturePatterns beside PendingRuns in the same
        call, and a run with nothing pending publishes PendingRuns alone.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["3.1"]
      branch: "feature/feature-labels/3.2-scenario-report-metric"
      commit_message: "feat(silver): synthetic feature wordings, the report line and the metric for unknown ones"
      acceptance_criteria:
        - "The synthetic landing holds the three listings with their features"
        - "After a backfill syn-furnished has furnishing furnished, syn-tenant is tenant-occupied, and feature_pattern has exactly one row with a null target"
        - "An incremental run and a backfill each print the two snapshot lines and `unknown feature patterns: 1`"
        - "With --metrics the fake client receives PendingRuns 0 and UnknownFeaturePatterns 1 in one call; a second run with nothing pending sends PendingRuns alone"
        - "Every other test of the suite passes without a changed expectation, or the changed expectation is a count that the new listings raise"
      tdd:
        red:
          test_file: "tests/test_silver_incremental.py"
          change: |
            tests/test_silver_incremental.py: a test reading both tables after a backfill.
            tests/test_synthetic_landing.py: the three listings are present with their features.
            tests/test_silver_cli.py: the three report lines, and the metrics test expects both
            metrics.
          command: "python -m unittest tests.test_silver_incremental tests.test_synthetic_landing tests.test_silver_cli -v"
          expected_failure: "AssertionError: no row of syn-furnished, the regular expressions do not match, and the metric list lacks UnknownFeaturePatterns"
        green:
          change: "The keyword, the scenario and its registration; the result field, the report lines and the metric."
          command: "python -m unittest tests.test_silver_incremental tests.test_synthetic_landing tests.test_silver_cli -v"
        refactor:
          change: "The scenario's comment says what each listing is for."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/synthetic/landing.py"
        - "src/silver/rebuild.py"
        - "tests/test_silver_incremental.py"
        - "tests/test_synthetic_landing.py"
        - "tests/test_silver_cli.py"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/silver/sink.py"
        - "src/silver/sql/**"
        - "src/silver/feature_patterns.py"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "src/synthetic/landing.py"
        - "src/silver/rebuild.py"
        - "tests/test_silver_incremental.py"
        - "tests/test_synthetic_landing.py"
        - "tests/test_silver_cli.py"

    - id: "4.1"
      title: "The alarm for unknown wordings"
      description: |
        infra/silver/alerts.tf: one aws_cloudwatch_metric_alarm after the pattern of the
        PendingRuns alarm: metric UnknownFeaturePatterns in the same namespace, statistic
        Maximum, period 3600, one evaluation period, GreaterThanThreshold 0, treat_missing_data
        "ignore", alarm action the existing topic. Its description says: a feature wording is
        not in the registry; read feature_pattern for rows with a null target and add them to
        src/silver/feature_patterns.py. Nothing is applied in this task.
      status: "not_started"
      complexity: "low"
      estimated_hours: 0.5
      depends_on: ["3.2"]
      branch: "feature/feature-labels/4.1-alarm"
      commit_message: "feat(infra): alarm when a feature wording is not in the registry"
      acceptance_criteria:
        - "terraform fmt -check and validate pass"
        - "The alarm ignores missing data and names the existing topic"
        - "No other resource changes"
      tdd: null
      validation_commands:
        - "terraform -chdir=infra/silver init -backend=false && terraform -chdir=infra/silver fmt -check && terraform -chdir=infra/silver validate"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "infra/silver/alerts.tf"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/silver/*.tfvars"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "infra/silver/alerts.tf"

    - id: "4.2"
      title: "Runbook and README"
      description: |
        docs/silver-rebuild.md: both tables join "The tables", each with a section of its own.
        feature_pattern: what a wording is, the columns, what a null target means and how to add
        a wording to the registry (and when to list it by digest), what listings_target_missing
        shows and that its repair belongs to the acquisition side, and that the table is private
        because a new wording could be typed text. listing_feature_label: the columns, that a
        label is the portal's statement and not a verified fact, and that furnishing is null
        when no wording states it. The report lines join the example output, the tables the
        incremental-mode description, and the alarm the alarms section with what to do when it
        mails. The cost section gains the metric and the alarm. README.md: the status text
        counts two more Iceberg tables and names the feature labels.
      status: "not_started"
      complexity: "low"
      estimated_hours: 0.75
      depends_on: ["4.1"]
      branch: "feature/feature-labels/4.2-docs"
      commit_message: "docs(silver): describe feature_pattern and listing_feature_label"
      acceptance_criteria:
        - "The runbook states both tables, the registry procedure, the reading and the alarm"
        - "The README counts the Silver tables correctly"
        - "The leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "docs/silver-rebuild.md"
        - "README.md"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "docs/silver-rebuild.md"
        - "README.md"

    - id: "4.3"
      title: "Deployment, first real run and implementation note (operator)"
      description: |
        Starts only after the integration branch is merged to main through the final PR. Every
        AWS action needs explicit user approval in chat.
        1. Wait for the image of the merge commit; set silver_image in the gitignored tfvars;
           terraform plan and apply in infra/silver. Only the new alarm and a new task
           definition revision may change.
        2. Let the next landing commit or the catch-up start a task. No backfill. From the task
           log take the two snapshot ids, the count of unknown wordings and the duration, and
           compare it with the durations recorded for FEATURE-009.
        3. In Athena, privately and as counts only, with the same rule written in Athena SQL:
           wordings (100 expected) and unknown ones (0); listings per label (1,157 tenant, 71
           bare ownership; furnishing 4,488, 834 and 391 on the snapshot of 2026-11-16, moved by
           the days since); label rows equal to text rows; no null boolean.
        4. Write dev/plans/implementations/FEATURE-010-feature-labels.md with those counts, the
           durations, and a table for the acquisition side: every wording with the target unread
           and every wording whose listings_target_missing is above zero, with its counts. The
           wording that is listed by digest appears there by its target and count only. Set the
           feature plan to complete, tick its success criteria, add the progress-log entry and
           update the registry row.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.0
      depends_on: ["4.2"]
      branch: "feature/feature-labels/4.3-first-run-record"
      commit_message: "docs(plans): FEATURE-010 first run, label counts and unread wordings"
      acceptance_criteria:
        - "A Silver task after the deployment exits 0, prints both snapshots and `unknown feature patterns: 0`"
        - "The counts of both tables equal the Athena implementation of the rule on the same run's tables"
        - "The alarm exists and is in the state OK"
        - "The note holds counts and wordings of the registry only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-010-feature-labels.md"
        - "dev/plans/FEATURE-010-feature-labels.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-010-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Set silver_image back to the previous tag and apply; drop the two Silver tables; revert the commit"
      files_to_create:
        - "dev/plans/implementations/FEATURE-010-feature-labels.md"
      files_to_modify:
        - "dev/plans/FEATURE-010-feature-labels.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-010-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/feature-labels/integration"
    task_branch_strategy: |
      Create the integration branch from main after the final PR of FEATURE-009 is merged and
      main holds this feature's plan, review and technical plan. Task 1.1 starts from the
      integration branch; each later task up to 4.2 starts from the integration branch after its
      predecessor is merged. The tasks share rebuild.py and the statements, so none runs in
      parallel. Task 4.3 starts from main after the final PR is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 2.1, 2.2, 3.1, 3.2, 4.1, 4.2, never rewriting history,
      and run validation.final_commands there. The final PR goes from the integration branch to
      main. Task 4.3's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): labels from listing features and a check for unread wordings"
    final_pr_description: |
      Implements FEATURE-010: Silver gains listing_feature_label (tenant-occupied, bare
      ownership, furnishing) and feature_pattern (every feature wording with the column that
      carries it), recomputed whole in every run, with a metric and an alarm for wordings that
      are not in the registry. See dev/reviews/REVIEW-FEATURE-010.md (approved). Nothing is
      applied by this PR; task 4.3 deploys with approval.

  notes:
    - "One wording is listed by its SHA-256 digest because the leak guard refuses one of its words. Never write it in clear in the repository, and never change dev/tools/ to make a wording pass."
    - "Never print, log or commit a real listing id or a feature string that is not in the registry; an unknown wording could be typed text. Reports are counts."
    - "infra/silver/*.tfvars hold real values and are gitignored: only silver_image changes, by the operator, in task 4.3."
    - "regexp_replace needs the 'g' option in DuckDB. The Athena rule of task 4.3 replaces every match by default."
    - "Read Silver's listing and listing_text for the label rules before any rule function is called: listing_quality() and the feature functions replace the temporary table silver_listing with their own columns."
    - "The three synthetic listings must not get coordinates: with them they would pair under rule pg1 with each other."
    - "FEATURE-011 and FEATURE-012 change process_landing too and start after this feature is merged."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
