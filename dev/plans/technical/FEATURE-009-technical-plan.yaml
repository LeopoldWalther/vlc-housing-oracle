    - id: "3.1"
      title: "Runbook and README"
      description: |
        docs/silver-rebuild.md: add listing_price to "The tables" and a section of its own: what a
        sighting is, the order, what a period is, the eleven columns, and the reading. The reading
        states that listing.price_eur stays the price of the detail record and the current price
        is the row with is_current; that is_current means the last price seen, not that the
        listing is online; that previous_price_eur is observed and declared_previous_price_eur is
        the portal's statement; that weekly sightings hide short-lived prices; and that the table
        is recomputed and replaced whole in every run. Add the report line to the example output
        and the table to the incremental-mode description. README.md: the status text counts one
        more Iceberg table.
      status: "not_started"
      complexity: "low"
      estimated_hours: 0.5
      depends_on: ["2.2"]
      branch: "feature/listing-price-history/3.1-docs"
      commit_message: "docs(silver): describe listing_price"
      acceptance_criteria:
        - "The runbook states the sighting, the order, the period, the columns and the reading"
        - "The README counts the Silver tables correctly"
        - "The leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
