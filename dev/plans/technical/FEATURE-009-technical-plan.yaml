        - "README.md"

    - id: "3.2"
      title: "Deployment, first real run and implementation note (operator)"
      description: |
        Starts only after the integration branch is merged to main through the final PR.
        1. Wait for GitHub Actions to publish the image of the merge commit (tag = SHA).
        2. In the operator's local, gitignored infra/silver/silver.auto.tfvars set silver_image
           to that tag; terraform plan and apply in infra/silver. Only a new task definition
           revision and the consumer's reference to it may change. Never stage, print or commit
           the file.
        3. Let the next landing commit or the catch-up start a task. No backfill. From the task
           log take the listing_price snapshot id and the task's duration, and compare it with
           the durations recorded in the implementation note of FEATURE-013.
        4. In Athena, privately and as counts only: rows, listings, listings with more than one
           period, rows with is_current, reductions and increases (previous_price_eur above or
           below price_eur), and periods with a declared previous price; and the same counts
           from the rule written in Athena SQL over observation and listing_detail of the same
           run, with the total order of the conventions. All counts must be equal, and rows with
           is_current must equal listings. No row is returned or saved.
        5. Write dev/plans/implementations/FEATURE-009-listing-price-history.md with the counts,
           the share of listings whose current price differs from listing.price_eur, the
           snapshot date and the durations; set the feature plan to complete, tick its success
           criteria, add the progress-log entry and update the registry row.
        Every AWS action needs explicit user approval in chat.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.25
      depends_on: ["3.1"]
      branch: "feature/listing-price-history/3.2-first-run-record"
      commit_message: "docs(plans): FEATURE-009 first run and price period counts"
      acceptance_criteria:
        - "A Silver task after the deployment exits 0 and prints a listing_price snapshot"
        - "The counts of the table equal the Athena implementation of the rule on the same run's tables"
        - "Rows with is_current equal the listings in the table"
        - "The task duration before and after is recorded"
        - "The note holds counts only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-009-listing-price-history.md"
        - "dev/plans/FEATURE-009-listing-price-history.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-009-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Set silver_image back to the previous tag and apply; drop the Silver table listing_price; revert the commit"
      files_to_create:
        - "dev/plans/implementations/FEATURE-009-listing-price-history.md"
      files_to_modify:
        - "dev/plans/FEATURE-009-listing-price-history.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-009-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/listing-price-history/integration"
    task_branch_strategy: |
      Create the integration branch from main after the final PR of FEATURE-013 is merged; main
      then holds this feature's plan, review and technical plan. Task 1.1 starts from the
      integration branch; each later task up to 3.1 starts from the integration branch after its
      predecessor is merged. The tasks share one statement, rebuild.py and one test file, so none
      runs in parallel. Task 3.2 starts from main after the final PR is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 2.1, 2.2, 3.1, never rewriting history, and run
      validation.final_commands there. The final PR goes from the integration branch to main.
      Task 3.2's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): listing price history"
    final_pr_description: |
      Implements FEATURE-009: Silver gains listing_price, one row per listing and price period
      from search cards and detail records, recomputed whole in every run. See
      dev/reviews/REVIEW-FEATURE-009.md (approved). The table is created by the first run after
      deployment; no backfill and no infrastructure change.

  notes:
    - "Never print, log or commit a real listing id or price of a listing; task 3.2 outputs counts only."
    - "infra/silver/*.tfvars hold real values and are gitignored: only silver_image in silver.auto.tfvars changes, by the operator, in task 3.2."
    - "Read walk, observation and listing_detail from Silver before listing_events() or listing_prices() is called: each replaces the temporary tables with its own columns only."
    - "Real Silver held no two priced sightings of one listing at one instant on 2026-11-16; the tie rule exists for determinism, and the synthetic landing exercises it (syn-tied, syn-repriced)."
    - "listing.price_eur does not change. Replacing it would need a new transformation_version and a backfill and is out of scope."
    - "The synthetic listing syn-returned must not get a detail record: it would enter listing_quality and could pair under rule pg1."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
