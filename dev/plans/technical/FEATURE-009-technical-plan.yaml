      status: "not_started"
      complexity: "low"
      estimated_hours: 1.0
      depends_on: ["2.1"]
      branch: "feature/listing-price-history/2.2-scenario-and-report"
      commit_message: "feat(silver): a returning price in the synthetic landing and the listing_price report line"
      acceptance_criteria:
