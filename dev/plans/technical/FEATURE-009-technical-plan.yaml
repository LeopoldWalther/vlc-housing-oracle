        write_silver_tables call. Update the comment above the call: a run can also add a
        sighting to any listing's history.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.0
      depends_on: ["1.2"]
      branch: "feature/listing-price-history/2.1-run-writes-the-table"
      commit_message: "feat(silver): recompute listing_price in every run"
      acceptance_criteria:
