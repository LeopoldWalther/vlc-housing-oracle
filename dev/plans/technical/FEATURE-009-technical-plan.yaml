        previous_price_eur and declared_previous_price_eur. Do not add the table to SILVER_TABLES
        yet.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: []
      branch: "feature/listing-price-history/1.1-price-periods"
      commit_message: "feat(silver): price periods of a listing from its sightings"
      acceptance_criteria:
        - "One price over three days gives one row with sightings 3, the first and last instants, period 1 and is_current true"
        - "A change gives two rows; prices A, B, A give three rows with periods 1, 2, 3"
        - "An empty card, a card without a price and a detail record without a price are ignored; a listing with none but these has no row"
        - "A listing with a detail record and no card has one period"
        - "A card and a detail record at one instant with different prices give the card's period first; two detail records at one instant give the lower price first"
        - "Exactly one row per listing has is_current true, and it is the last period"
        - "Rows are ordered by source, source_listing_id, period and carry transformation_version silver-v1"
        - "The existing suite is unchanged and green"
      tdd:
        red:
          test_file: "tests/test_silver_listing_price.py"
          change: |
            New file with helpers that build Arrow tables of observation rows and detail rows (the
            columns of the two constants) and a test class calling
            listing_prices(duckdb.connect(), observation, listing_detail). Add the cases of the
            acceptance criteria.
          command: "python -m unittest tests.test_silver_listing_price -v"
          expected_failure: "ImportError: cannot import name 'listing_prices' from 'src.silver.rebuild'"
        green:
          change: |
            listing_price.sql: the union of the two kinds of sightings, the total order, a period
            number from a running count of price changes, and one row per period. listing_prices()
            and the two constants.
          command: "python -m unittest tests.test_silver_listing_price -v"
        refactor:
          change: "The header comment states what a sighting, the order and a period are; counts are cast to INTEGER."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/silver/sql/listing_price.sql"
        - "src/silver/rebuild.py"
        - "tests/test_silver_listing_price.py"
      forbidden_files:
        - "infra/**"
        - "contracts/**"
        - "src/synthetic/**"
        - "src/silver/sink.py"
        - "src/silver/property_group.py"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "src/silver/sql/listing_price.sql"
        - "tests/test_silver_listing_price.py"
      files_to_modify:
        - "src/silver/rebuild.py"

    - id: "1.2"
