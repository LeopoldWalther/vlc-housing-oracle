# Technical plan for FEATURE-009 — Listing price history.
# Emitted by the reviewer with the approval of 2026-11-16. It carries corrections M1, M2 and M3,
# folded into the feature plan. Task statuses here are the source of truth for progress.
# Implementation starts after FEATURE-013 is merged to main.

technical_plan:
  metadata:
    for_feature: "FEATURE-009"
    created_by: "reviewer_agent"
    created_at: "2026-11-16"
    version: "1.0"
    total_tasks: 6
    estimated_hours: "6"
    risk_level: "low"
    critical_path: ["1.1", "1.2", "2.1", "2.2", "3.1", "3.2"]
    feature_plan: "dev/plans/FEATURE-009-listing-price-history.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-009.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "workflow-consistency"
    # No coverage threshold is configured.
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"

  conventions: |
    - The table listing_price: one row per listing and price period, ordered by source,
      source_listing_id, period. Columns, in order, with Arrow types:
        source                        string
        source_listing_id             string
        period                        int32      1 for the first observed price, rising by 1
        price_eur                     int32      the price of the period
        first_observed_at             timestamp(us, UTC)
        last_observed_at              timestamp(us, UTC)
        sightings                     int32      sightings in the period
        previous_price_eur            int32      price of the period before; null for period 1
        declared_previous_price_eur   int32      prev_price_eur of the period's first sighting,
                                                 card or detail record; null without one
        is_current                    bool       true for the listing's last period, never null
        transformation_version        string
    - A price sighting is a row of silver_observation with is_empty_card false and a non-null
      price_eur, or a row of silver_listing_detail with a non-null price_eur.
    - Sightings of one listing (source, source_listing_id) are in this total order (review M1):
      observed_at, then cards before detail records, then price_eur, then prev_price_eur with
      nulls last. A period is a maximal run of consecutive sightings with one price_eur. A return
      to an earlier price is a new period.
    - The statement is src/silver/sql/listing_price.sql. It reads the temporary tables
      silver_observation and silver_listing_detail and takes transformation_version from the
      DuckDB variable, like every Silver statement.
    - listing_prices(connection, observation, listing_detail) -> pyarrow.Table in
      src/silver/rebuild.py is the public entry point, after the pattern of listing_events(): it
      prepares the session, replaces the two temporary tables with the given Arrow tables and
      runs the statement. It needs PRICE_OBSERVATION_COLUMNS (source, source_listing_id,
      observed_at, price_eur, prev_price_eur, is_empty_card) and PRICE_DETAIL_COLUMNS (source,
      source_listing_id, observed_at, price_eur, prev_price_eur).
    - From task 2.1 on, listing_price is the last member of SILVER_TABLES. process_landing reads
      walk, observation and listing_detail from Silver once, before the event rule and the price
      rule run; observation is read with the event columns followed by the price columns it
      lacks, and each rule receives the table narrowed to its own columns (review M2).
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table, column or test expectation
      about other tables changes.
    - Money stays integer euros. No percentage is stored.
    - Tests use synthetic values only (source "syn", invented municipalities) and compare results
      as Arrow rows (to_pylist()), never through fetchall.
    - All repository artifacts are in English.

  tasks:
    - id: "1.1"
      title: "Price periods from sightings"
      description: |
        Create src/silver/sql/listing_price.sql and listing_prices() with the two column constants
