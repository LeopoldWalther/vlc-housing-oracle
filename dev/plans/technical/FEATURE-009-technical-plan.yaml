        - "After a backfill, listing_price holds three periods for syn-returned: 400,000, 380,000 and 400,000, the third current, with previous prices null, 400,000 and 380,000"
        - "An incremental run and a backfill each print one line `listing_price: snapshot <digits>`"
        - "Every other test of the suite passes without a changed expectation, or the changed expectation is a count that the new listing raises by one"
      tdd:
