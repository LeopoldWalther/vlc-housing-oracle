# Technical plan for FEATURE-004 — Incremental Silver from landing v3, run by AWS.
# Emitted by the reviewer with the round-2 approval. It carries round-1 corrections (H1, M1-M3,
# L1-L4, folded into the plan) and round-2 corrections R2-M1 (the consumer adopts a running task
# or starts one), R2-M2 (no batching window on the FIFO event source mapping) and R2-L1-L3.
# Task statuses here are the source of truth for progress.

technical_plan:
  metadata:
    for_feature: "FEATURE-004"
    created_by: "reviewer_agent"
    created_at: "2026-10-19"
    version: "1.0"
    total_tasks: 18
    estimated_hours: "33.5"
    risk_level: "medium"
    critical_path: ["1.1", "1.2", "2.1", "1.2b", "2.2", "3.2", "3.3", "4.1", "5.1", "5.2", "5.3", "6.1", "6.2"]
    feature_plan: "dev/plans/FEATURE-004-incremental-silver-from-landing-v3.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-004.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "workflow-consistency"
      - "terraform-validate"
    # No coverage threshold is configured. The test count must never fall below 83, the count on
    # 0a1387a before the migration (review R2-L3).
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
      - "terraform -chdir=infra/silver init -backend=false && terraform -chdir=infra/silver fmt -check && terraform -chdir=infra/silver validate"

  conventions: |
    - Imports are `src.<package>` from the repository root, matching
      `python -m unittest discover -s tests -t .` and `python -m src.silver.rebuild`.
    - Every fixture is synthetic: `syn-` listing ids, invented areas, run ids built from invented
      instants or `import-<date>`, visibly fake phone numbers. No test touches AWS or the network.
    - Errors name tables, run ids, days and counts, never row values.
    - Constants stay in `src/silver/rebuild.py`: NAMESPACE = "vlc_housing_silver",
      TRANSFORMATION_VERSION = "silver-v1", REDACTION_VERSION = "r1"; the ingest table is
      `landing_ingest`.
    - "Latest run" always means latest `run_started_at`, then `run_id` (plan, L3).
    - Correctness never relies on an Iceberg commit failing: PyIceberg 0.12 rebases and retries
      a conflicting commit (plan, Assumption 5). Overlap is prevented by the queue and the
      consumer's adopt-or-start rule, not detected.
    - `infra/silver/terraform.tfvars` and `infra/silver/backend.tfvars` exist locally with real
      values, are gitignored, and are never read, printed, staged or modified by a task.

