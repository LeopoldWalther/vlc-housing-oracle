        - "Every commit carries the contract's fields; its row_counts and observed_dates equal its files"
        - "Every table has a file for every run, a zero-row file where a run has no rows"
        - "Each named scenario is present, asserted per scenario"
        - "The same seed gives equal files and commits; every listing id starts with 'syn-'"
        - "A row without run_id raises ValueError naming the table"
      tdd:
