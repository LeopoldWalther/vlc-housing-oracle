  git_workflow:
    base_branch: "main"
    integration_branch: "feature/incremental-silver-v3/integration"
    task_branch_strategy: |
      Create the integration branch from main. A task without dependencies (1.1, 4.2) starts from
      the integration branch. A dependent task starts from the integration branch after all of its
      depends_on tasks are merged into it. Tasks touching the same file are never run in parallel
      (src/silver/rebuild.py: 2.2, 3.2, 3.3, 4.1; src/silver/landing.py: 2.1, 1.2b, 2.2, 3.2).
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in dependency order (1.1, 1.3, 2.3, 2.4, 4.2, 1.2, 2.1, 1.2b, 2.2, 3.1, 3.2,
      3.3, 4.1, 5.1, 5.2, 5.3, 6.1, 6.2), never rewriting history, and run validation.final_commands
      there.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "fix", "test", "docs", "refactor", "chore", "build"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin"
    final_pr_title: "feat(silver): incremental Silver from landing v3, run by AWS"
    final_pr_description: |
      Implements FEATURE-004. See dev/reviews/REVIEW-FEATURE-004.md (round 2, approved) for context.

  notes:
    - "PyIceberg 0.12 rebases and retries conflicting commits; never write a test or a branch that expects CommitFailedException."
    - "The consumer's adopt-or-start rule is what keeps one task at a time when an invocation times out or crashes; keep it in every refactor."
    - "FIFO event source mappings do not support a batching window; Terraform validate does not catch it, apply would."
    - "The queue message body is never read; the work is always the set difference between commits and the ingest log."
    - "infra/silver/terraform.tfvars and backend.tfvars hold real values locally; never stage, print or edit them."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
