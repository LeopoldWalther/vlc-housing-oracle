    - id: "4.2"
      title: "The queue consumer: adopt a running task or start one"
      description: |
        `src/silver/consumer.py`, boto3 only (never DuckDB or PyIceberg):
        `handler(event, context, *, ecs=None, now=None)`. Configuration from environment
        variables: cluster, task definition family and ARN, subnets, security group,
        assign-public-ip flag (R2-L2). On every invocation, whatever the batch size: list the
        cluster's RUNNING tasks of the Silver family (`ecs:ListTasks`); if one exists, adopt it
        (wait for it) and do not start another (R2-M1); otherwise `RunTask` once with
        `--mode incremental --metrics` and the network configuration. Poll `DescribeTasks` until
        STOPPED; return on exit code 0; raise on a non-zero exit code or a task that stopped
        without starting; raise when `context.get_remaining_time_in_millis()` falls below a
        margin while the task still runs, leaving the task running (the redelivery adopts it).
