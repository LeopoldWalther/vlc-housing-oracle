          expected_failure: "Assertions fail because the writer produces landing/v1/<table>.parquet and no commits"
        green:
          behavior: "The v3 writer and the new scenarios"
          command: "python -m unittest discover -s tests -t . -p 'test_synthetic_landing.py' -v"
        refactor:
