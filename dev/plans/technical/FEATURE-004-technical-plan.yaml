    - id: "1.2"
      title: "The synthetic writer and generator write landing v3"
      description: |
        `write_landing_tables(directory, rows_by_table)` keeps its row-based interface, requires
        `run_id` on every row, groups rows by run, writes
        `landing/v3/<table>/run_date=<run start date>/run=<run_id>/part-0.parquet` for every
        table of every run (zero-row files included) and `landing/v3/_commits/<run_id>.json` with
        every contract commit field, true of the files (`row_counts`, `observed_dates`).
        `run_started_at`, `outcome` and `is_replay` per run come from an optional `runs`
        argument, defaulting to the run id's instant, `ok` and false. `generate_landing(directory,
        seed)` assigns rows to runs by their instants and adds the scenarios: two live runs on one
        day, a replay run re-deriving an old day with a newer `ingested_at`, an import run
        (`import-<date>`) with records and no reports, a `failed` run, a run with no rows for one
        table, and a listing whose chosen detail record lies in an earlier run than its latest
        observation. FEATURE-001's existing generator tests are kept and adapted to the v3 layout.
      status: "done"
      complexity: "high"
      estimated_hours: 3
      depends_on: ["1.1"]
      branch: "feature/incremental-silver-v3/1.2-synthetic-v3"
      commit_message: "feat(synthetic): write landing v3 runs and commits"
