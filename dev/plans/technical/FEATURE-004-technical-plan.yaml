        log, take the pending set (every commit in backfill), register the named runs, replace
        walk, observation and listing_detail per day, update the affected listings, record the
        ingest log last. `ProcessResult` reports pending, processed, days per table, affected
        count and snapshot ids. FEATURE-001's whole `rebuild()` is replaced by the backfill mode;
