    - id: "2.3"
      title: "Partitioned tables, day replacement, upsert and delete in the sink"
      description: |
        `src/silver/sink.py` gains: `replace_days(catalog, namespace, name, rows, days,
        properties)` creating a table partitioned by `identity(observed_date)` or evolving an
        existing unpartitioned one with `update_spec()`, then `overwrite(rows,
        overwrite_filter=In("observed_date", days))`; rows outside `days` raise `ValueError`.
        `upsert_rows(catalog, namespace, name, rows, keys, delete_keys, properties)` upserting
        on `keys` and deleting `delete_keys` in one transaction. The FEATURE-001 column-name check
        applies to both. Snapshot properties carry `landing_run_count`, `landing_run_first`,
        `landing_run_last`, the versions and the contract digest (L2).
