    - id: "3.2"
      title: "Deployment, first real run and implementation note (operator)"
      description: |
        Starts only after the integration branch is merged to main through the final PR.
        1. Wait for GitHub Actions to publish the image of the merge commit (tag = SHA).
        2. In the operator's local, gitignored infra/silver/silver.auto.tfvars set silver_image
           to that tag; terraform plan and apply in infra/silver. Only a new task definition
           revision and the consumer's reference to it may change. Never stage, print or commit
           the file.
        3. Let the next landing commit or the catch-up start a task. No backfill. From the task
           log take the listing_quality snapshot id and the task's duration (log-stream creation
           to last event), and compare the duration with the 21 s to 24 s before.
        4. In Athena, privately and as counts only: count the true values of each flag per
           operation in listing_quality, and count the same rules written in Athena SQL over the
           listing snapshot of the same run. The Athena rule computes the exact median of each
           municipality's latitude and longitude as the mean of the two middle values of the
           sorted values (review M3). The counts per flag and operation must be equal. No row is
           returned or saved.
        5. Write dev/plans/implementations/FEATURE-008-listing-quality.md with the counts beside
           the architect's evidence of 2026-11-15, the snapshot date and the durations; set the
           feature plan to complete, tick its success criteria, add the progress-log entry and
           update the registry row.
        Every AWS action needs explicit user approval in chat.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.25
      depends_on: ["3.1"]
      branch: "feature/listing-quality/3.2-first-run-record"
      commit_message: "docs(plans): FEATURE-008 first run and flag counts"
      acceptance_criteria:
        - "A Silver task after the deployment exits 0 and prints a listing_quality snapshot"
        - "Counts per flag and operation in listing_quality equal the Athena implementation of the rules on the same listing snapshot"
        - "The task duration before and after is recorded"
        - "The note holds counts only; the leak guard and the workflow validator pass"
