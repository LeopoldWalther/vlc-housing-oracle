        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-008-listing-quality.md"
        - "dev/plans/FEATURE-008-listing-quality.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-008-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Set silver_image back to the previous tag and apply; drop vlc_housing_silver.listing_quality; revert the commit"
      files_to_create:
        - "dev/plans/implementations/FEATURE-008-listing-quality.md"
      files_to_modify:
        - "dev/plans/FEATURE-008-listing-quality.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-008-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/listing-quality/integration"
    task_branch_strategy: |
      Create the integration branch from main and commit the feature plan, the review, this file
      and the FEATURE-008 registry row there first. Task 1.1 starts from the integration branch;
      each later task up to 3.1 starts from the integration branch after its predecessor is
      merged. The tasks share listing_quality.sql, rebuild.py and one test file, so none runs in
      parallel. Task 3.2 starts from main after the final PR is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 1.3, 2.1, 2.2, 2.3, 3.1, never rewriting history, and
      run validation.final_commands there. The final PR goes from the integration branch to
      main. Task 3.2's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): listing quality flags"
    final_pr_description: |
      Implements FEATURE-008: Silver gains listing_quality, twelve plausibility and location
      flags per listing, recomputed whole from listing in every run. See
      dev/reviews/REVIEW-FEATURE-008.md (approved). The table is created by the first run after
      deployment; no backfill and no infrastructure change.

  notes:
    - "Never print, log or commit a real listing id, municipality or coordinate; task 3.2 outputs counts only."
    - "infra/silver/*.tfvars hold real values and are gitignored: only silver_image in silver.auto.tfvars changes, by the operator, in task 3.2."
    - "listing_quality() replaces the temporary table silver_listing; in process_landing call it with a fresh catalog read, after listing is written. listing_events() replaces silver_walk and silver_observation, so the order of the two calls does not matter."
    - "If a threshold changes later, bump transformation_version and run the backfill in the same operator session (review L1)."
    - "Every processed run writes a new snapshot of the table; expiry is the pending decision that also covers listing_event (review L2)."
    - "Almost every synthetic listing has coordinates_missing true; do not add coordinates to other scenarios (review L3)."
    - "Moving listing_property_group from Gold to Silver is the next feature, not part of this one; src/gold stays untouched."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
