  conventions: |
    - The table listing_quality: one row per listing of Silver's listing with a detail record
      (detail_observed_at IS NOT NULL), ordered by source, source_listing_id. Columns, in order:
        source, source_listing_id,
        price_out_of_bounds, sqm_built_below_min, sqm_built_above_max,
        price_per_sqm_below_min, price_per_sqm_above_max, sqm_usable_above_built,
        rooms_above_max, bathrooms_above_rooms, year_built_out_of_range, price_drop_above_max,
        coordinates_missing, far_from_municipality,
        transformation_version.
      Arrow types: string, string, twelve bool, string.
    - Rules (thresholds as named constants in src/silver/rebuild.py, passed to the statement as
      DuckDB variables like transformation_version). operation 'rent' uses the rent thresholds,
      every other operation the sale thresholds.
        price_out_of_bounds       price_eur < 10000 or > 20000000 (sale); < 100 or > 30000 (rent)
        sqm_built_below_min       sqm_built < 10
        sqm_built_above_max       sqm_built > 2000
        price_per_sqm_below_min   sqm_built > 0 and price_eur < 300 * sqm_built (sale), 2 * (rent)
        price_per_sqm_above_max   sqm_built > 0 and price_eur > 15000 * sqm_built (sale), 60 * (rent)
        sqm_usable_above_built    sqm_usable > sqm_built
        rooms_above_max           rooms > 12
        bathrooms_above_rooms     bathrooms > rooms + 2
        year_built_out_of_range   year_built < 1500 or year_built > year(detail_observed_at) + 1 (UTC)
        price_drop_above_max      2 * price_eur < prev_price_eur
        coordinates_missing       latitude IS NULL or longitude IS NULL
        far_from_municipality     haversine distance (sphere of 6,371 km) to the municipality
                                  centre > 10 km; the centre is median(latitude), median(longitude)
                                  over the municipality's listings with a detail record and both
                                  coordinates, all operations together.
    - Every flag is coalesce(<condition>, false): a missing input gives false, never null.
    - Every product is computed as BIGINT (cast one operand), never as INTEGER (review M2).
    - The statement lives in src/silver/sql/listing_quality.sql, reads the temporary table
      silver_listing and defines its own haversine macro; Silver does not import from src/gold.
    - listing_quality(connection, listing) -> pyarrow.Table in src/silver/rebuild.py is the one
      public entry point: it prepares the session (UTC, variables), replaces the temporary table
      silver_listing with the given Arrow table, and runs the statement. It needs only the
      columns of a constant QUALITY_LISTING_COLUMNS: source, source_listing_id,
      detail_observed_at, operation, municipality, price_eur, prev_price_eur, sqm_built,
      sqm_usable, rooms, bathrooms, year_built, latitude, longitude.
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table, column or test expectation
      about other tables changes.
    - Tests use synthetic values only (source "syn", invented municipalities) and compare results
      as Arrow rows (to_arrow_table().to_pylist()), never through fetchall.
    - All repository artifacts are in English.

