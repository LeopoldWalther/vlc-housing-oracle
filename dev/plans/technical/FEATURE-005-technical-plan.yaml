        - "Missed listings are either explained by walk coverage or listed as a question for the acquisition repository"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "analysis/silver-quality/05_temporal.sql"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
      can_run_parallel_with: ["2.1", "2.2", "2.3", "2.4", "2.6"]
      reversible: true
      rollback: "Delete the file"
      files_to_create:
        - "analysis/silver-quality/05_temporal.sql"
      files_to_modify: []

    - id: "2.6"
      title: "Redaction residue"
      description: |
        analysis/silver-quality/06_redaction.sql applies r1's exact patterns, copied from
        src/silver/sql/redact.sql, and counts:
        - phone digits by their surroundings: standalone, glued to a letter, glued 34 country
          code, inside a longer number;
        - e-mail and web-address patterns;
        - honorific-plus-name forms that r1 misses.
        A confirmed contact detail is reported to the user at once, without its value.
      status: "done"
      complexity: "medium"
      estimated_hours: 0.75
      depends_on: ["1.1"]
      branch: "feature/silver-quality-exploration/2.6-redaction-residue"
      commit_message: "docs(analysis): what redaction r1 leaves behind"
      acceptance_criteria:
        - "Run on the strings of tests/test_silver_redaction.py after r1, the expressions find nothing; a hand-written glued 34… string is found"
        - "The counts per class are recorded; no matched text is committed"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "analysis/silver-quality/06_redaction.sql"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
      can_run_parallel_with: ["2.1", "2.2", "2.3", "2.4", "2.5"]
