    - id: "3.1"
      title: "Manual precision of duplicate strata (operator)"
      description: |
        Performed by the user, not the implementer.
        - The implementer runs the uncommitted sampling query: 30 concurrent pairs from each
          exclusive stratum (C; B without C; A±5 without B; A0 without A±10), ordered by a hash
          of the pair ids.
        - The implementer hands the sample to the user privately, outside the repository.
        - The user judges each pair from the listing pages: same / different / unsure / page gone.
        - Only the counts per stratum come back.
      status: "done"
      complexity: "medium"
      estimated_hours: 2.5
      depends_on: ["2.4"]
      branch: "feature/silver-quality-exploration/3.1-duplicate-precision"
      commit_message: "docs(analysis): precision of duplicate strata"
      acceptance_criteria:
        - "Counts for 4 strata x 30 pairs are recorded with the snapshot set they were drawn from"
        - "No pair id or page link is committed"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
      allowed_files:
