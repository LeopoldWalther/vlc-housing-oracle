      can_run_parallel_with: ["2.1", "2.2", "2.3", "2.5", "2.6"]
      reversible: true
      rollback: "Revert the commit"
      files_to_create:
        - "docs/data-quality/silver-quality-2026-11.md"
      files_to_modify: []

