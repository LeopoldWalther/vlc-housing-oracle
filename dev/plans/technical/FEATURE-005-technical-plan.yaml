      description: |
        Complete docs/data-quality/silver-quality-2026-11.md with:
        - the snapshot set;
        - per dimension, the measured rates and their meaning for each candidate use case;
        - the redaction result;
        - proposed rules (duplicate stratum and thresholds by measured precision, outlier
          bounds, completeness requirements per use case) and expected flag rates;
        - a sketch of the follow-up feature: a labels table with a quality_version, flagged and
          never filtered.
        Update the plan's progress log and the success criteria.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["2.1", "2.2", "2.3", "2.5", "2.6", "3.1"]
      branch: "feature/silver-quality-exploration/3.2-findings"
      commit_message: "docs(data-quality): Silver quality findings and proposed rules"
      acceptance_criteria:
        - "Every number cites the query file that produced it and the snapshot set"
        - "Each plausibility rule candidate has a decision: adopt with threshold, or drop"
        - "The leak guard and workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "docs/data-quality/silver-quality-2026-11.md"
        - "dev/plans/FEATURE-005-silver-quality-exploration.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-005-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
