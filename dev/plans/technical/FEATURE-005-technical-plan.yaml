        - "dev/plans/FEATURE-005-silver-quality-exploration.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-005-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/silver-quality-exploration/integration"
    task_branch_strategy: |
      Create the integration branch from main. Task 1.1 starts from the integration branch. Tasks
      2.1-2.6 each start from the integration branch after 1.1 is merged; they touch disjoint
      files and may run in any order. Task 3.1 starts after 2.4 is merged. Task 3.2 starts after
      every other task is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 3.1, 3.2, never rewriting
      history, and run validation.final_commands there.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "docs(data-quality): Silver data-quality exploration"
    final_pr_description: |
      Implements FEATURE-005. See dev/reviews/REVIEW-FEATURE-005.md (approved) for context.

  notes:
    - "Exploration only: no file under src/, tests/ or infra/ changes. A quality rule becomes code only in the follow-up feature."
    - "The public repository receives aggregates only. Review every committed SQL file's final SELECT and every number in the findings for row-level content before committing."
    - "Review M6: one description likely holds a phone number with a glued 34 prefix that r1 misses. Fixing it is a separate r2 bugfix decided by the user, not part of this feature."
    - "If an r2 bugfix lands before task 2.6, run 2.6 against r2 and say so in the findings."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
