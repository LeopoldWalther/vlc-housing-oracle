      files_to_modify: []

    - id: "4.3"
      title: "Deployment and first run (operator, with approval)"
      description: |
        After the final pull request is merged and its image is built. Needs the owner's
        explicit approval in chat for the apply, upper bound $0.01: set silver_image to the
        merged commit's image in the git-ignored variables file and run terraform plan; expect a
        new revision of the Silver and labeller task definitions with the references to them,
        the consumer's code and the mail text, nothing else. Apply. No backfill in AWS.
        Validation: the next Silver run exits 0 (or prints "nothing pending" in a finished
