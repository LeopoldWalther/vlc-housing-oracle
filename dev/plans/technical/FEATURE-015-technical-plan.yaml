    - id: "4.2"
      title: "Dry run on real landing (operator, with approval, before the final pull request)"
      description: |
        Needs the owner's explicit approval in chat, upper bound $0.10: one read of landing v3
        from the lake to a directory outside the repository, as the runbook's equality check
        does. With the integration branch checked out, run a local backfill of that copy into a
        fresh local catalog. It must exit 0. Then read, as counts and versions only: the
        distinct transformation_version values of the real ingest log and the redaction_version
        of listing_text's current snapshot summary; they must be silver-v1 and r2.
        Stop rule (review M4): if the backfill is refused, or a version differs, do not change
        any rule and do not open the final pull request. Report table, run id and days (no row
        value) to the owner and wait for a decision.
        Record the outcome in the implementation note: exit code, number of runs and files
        checked, the two versions. Delete the local copy afterwards.
      status: "not_started"
      complexity: "low"
      estimated_hours: 0.75
      depends_on: ["4.1"]
      branch: "feature/run-guards/4.2-dry-run-record"
