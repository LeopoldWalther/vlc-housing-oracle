        once per start; the backfill section says that a new rule or redaction version is
        deployed first and then backfilled, that incremental starts in between are refused, and
        that a started backfill is finished under the same image. infra/silver/alerts.tf: the
        legend says per task what a code means (review M5): Silver 1 failed and is retried up to
        three times, Silver 3 refused and not retried, labeller 1 as today; 137, 139 and none
        stay. docs/adr/0002-incremental-processing.md, decision 5: one sentence that an
