# Technical plan for FEATURE-015 — Run guards: a Silver run refuses what it cannot do correctly.
# Emitted by the reviewer with the approval of 2026-11-23. It carries corrections M1 to M6 and
# L1 of the review. Task statuses here are the source of truth for progress.

technical_plan:
  metadata:
    for_feature: "FEATURE-015"
    created_by: "reviewer_agent"
    created_at: "2026-11-23"
    version: "1.0"
    total_tasks: 10
    estimated_hours: "10.5"
    risk_level: "medium"
    critical_path: ["1.1", "1.2", "2.1", "2.2", "3.1", "3.2", "3.3", "4.1", "4.2", "4.3"]
    feature_plan: "dev/plans/FEATURE-015-run-guards.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-015.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "terraform-validate"
      - "workflow-consistency"
    # No coverage threshold is configured.
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
      - "terraform -chdir=infra/silver fmt -check && terraform -chdir=infra/silver validate"

  conventions: |
    - No rule changes what it writes. TRANSFORMATION_VERSION stays "silver-v1", REDACTION_VERSION
      stays "r2", no table gains a column, and there is no backfill in AWS.
    - Names, all in src/silver/rebuild.py unless said otherwise:
        class BackfillRequired(Exception)       the tables were written by another version
        EXIT_REFUSED = 3                        the command's exit code for a refusal
        require_current_versions(catalog, ingested) -> None
      src/silver/ingest.py: IngestedRun gains the field transformation_version: str, last.
      src/silver/landing.py: read_defect(error: duckdb.Error) -> str | None.
      src/silver/consumer.py: its own constant EXIT_REFUSED = 3 (the file is packaged alone and
      cannot import the command); a test pins the two constants equal.
    - require_current_versions reads the module constants when it is called, so a test can patch
      src.silver.rebuild.TRANSFORMATION_VERSION and REDACTION_VERSION. It raises
      BackfillRequired when
        (a) any run in `ingested` carries another transformation_version than the constant; the
            message names the versions found (sorted, comma separated), the code's version and
            the words "run --mode backfill";
        (b) the table listing_text exists, has a current snapshot, and that snapshot's summary
            has another redaction_version than the constant, or none; the message names the
            version found, or "unknown", the code's version and "run --mode backfill".
      An empty log passes (a). A missing listing_text table, or one without a snapshot, passes
      (b). The function writes nothing and reads no row of listing_text.
    - Where it is called (review M1): in process_landing, in incremental mode only, right after
      the ingest log is read and before pending(); in main, in incremental mode only, inside the
      reporting block, after the commits are listed and before the "nothing pending" branch. A
      backfill never calls it.
    - main, inside the reporting block and in this order (review M2): read the ingest log (not
      for a backfill), list the commits, set the pending count, call the guard, then either
      print "nothing pending" or run. The count starts as None; the metrics are published in the
      finally clause only when --metrics is given and the count is not None. So a refusal while
      listing publishes no PendingRuns, and a refusal by the guard publishes the number of
      pending runs.
    - Exit codes of the command: 0 done or nothing pending; 1 failed (any unhandled error, with
      Python's traceback); 2 usage; 3 refused, for LandingContractError, SilverSchemaError,
      ReferenceDataError, StoredAnswerError and BackfillRequired.
    - The refusal line on stderr (review M6): "Silver run refused: <message>", followed by
      " [cause: <qualified type name>]" when the error has a __cause__, for example
      "[cause: duckdb.IOException]". Never any text of the cause. Messages name tables, runs,
      days, versions and paths, never another row value.
    - Days of a pending file. register_landing_v3 gains the keyword-only parameter
      expected_dates: Mapping[str, Mapping[str, Collection[date]]] | None = None, keyed by run
      id and then table, given by process_landing for the pending runs from their commits. For
      every run in expected_counts it checks the file of each of the four tables, also of a
      table that runs_by_table does not name for that run. The views stay over runs_by_table
      exactly as today. _check_v3_file compares the file's distinct observed_date values with
      the commit's days of that table in the query that counts its rows:
        a day in the file that the commit does not name ->
          "landing table <table>: run <run_id> holds rows of <days> that its commit does not name"
        a day the commit names that the file does not hold ->
          "landing table <table>: run <run_id> commit names <days> that its file does not hold"
      Days are ISO dates, sorted, comma separated; a null observed_date is written "null" and
      counts as a day the commit does not name. Files of ingested runs are not checked again.
    - Read errors (review M3, L1). read_defect returns
        "is not a Parquet file"  for a duckdb.InvalidInputException,
        "has no file"            for a duckdb.HTTPException whose
                                 getattr(error, "status_code", None) == 404,
        None                     for every other error.
      At both sites (landing._check_v3_file and rebuild.read_census_sections) the handler catches
      duckdb.Error, raises the site's refusal with that text from the error when read_defect
      returns one, and otherwise re-raises the original with a bare `raise`. read_census_sections
      gets the same existence check for a local path that _check_v3_file has, with the message
      "census sections <file> has no file"; its other checks (columns, no row, several vintages)
      stay.
    - The consumer: exit code 3 returns {"task": <arn>, "exit_code": 3} after one log line
      "Silver task <arn> refused its run (exit code 3); not retried". Every other non-zero exit
      and a task that never ran still raise TaskFailed.
    - The labeller's exit codes do not change (review M5); FEATURE-017 owns them.
    - Tests use the synthetic landing only. A commit or a file is altered inside the test's
      temporary tree. No test needs a network, a cloud account or a paid service.
    - All repository artifacts are in English.

