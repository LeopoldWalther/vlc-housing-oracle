        - "dev/plans/FEATURE-015-run-guards.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-015-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/run-guards/integration"
    task_branch_strategy: |
      Create the integration branch from main and commit the review and this file there first,
      in one docs commit, together with the review's note in the feature plan. Task 1.1 starts
      from the integration branch; each later task up to 4.2 starts from the integration branch
      after its predecessor is merged. The tasks share rebuild.py and landing.py, so none runs
      in parallel. Task 4.3 starts from main after the final pull request is merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 2.1, 2.2, 3.1, 3.2, 3.3, 4.1, 4.2, never rewriting
      history, and run validation.final_commands there. The final pull request goes from the
      integration branch to main and is opened only after task 4.2 exited 0. Task 4.3's branch
      goes to main through its own small pull request.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "fix", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): run guards for versions, days and refusals"
    final_pr_description: |
      Implements FEATURE-015: an incremental Silver run is refused before its first write when
      the code's rule or redaction version differs from the version that wrote the tables, or
      when a pending landing file holds other days than its commit names. A refusal exits 3 and
      is not retried by the queue; a failure exits 1 and is. Read errors are no longer reported
      as contract violations. No rule changes what it writes: no new transformation_version and
      no backfill. See dev/reviews/REVIEW-FEATURE-015.md (approved). Deployment is one apply.

  notes:
    - "Never print, log or commit a real listing id, run id, municipality, bucket or account name; tasks 4.2 and 4.3 output counts, versions and exit codes only."
    - "infra/silver/*.tfvars hold real values and are gitignored: only silver_image changes, by the operator, in task 4.3."
    - "Every AWS action and every paid step needs the owner's explicit approval in chat with its upper bound: $0.10 for task 4.2, $0.01 for task 4.3."
    - "The stop rule of task 4.2 is not optional: a refused dry run goes back to the owner, the days check is not weakened by the Implementer."
    - "The labeller's exit codes and its mail legend entry stay as they are; FEATURE-017 owns them."
    - "FEATURE-016 edits main, consumer.py and alerts.tf too and starts after this feature is merged; exit code 124 is reserved for its run-time limit."
    - "FEATURE-020 must keep redaction_version on the current snapshot of listing_text: a maintenance snapshot without it makes the guard refuse."
    - "The owner's three questions are answered as the plan recommends (review, Approval criteria); an objection before task 3.2 changes that task only."
    - "Status-only workflow artifact updates are implicit administrative files, not implementation scope."
