    - id: "1.1"
      title: "Rule-version guard"
      description: |
        IngestedRun reports the transformation_version of its log row. Add BackfillRequired and
        require_current_versions with check (a) and call it in process_landing as the
        conventions say. Check (b) is task 1.2.
      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: []
      branch: "feature/run-guards/1.1-rule-version-guard"
      commit_message: "feat(silver): an incremental run is refused under another rule version"
      acceptance_criteria:
        - "ingested_runs returns the transformation_version of every row"
        - "An incremental process_landing under a patched TRANSFORMATION_VERSION raises BackfillRequired naming both versions and 'backfill', and the current snapshot id of every table is unchanged"
        - "A backfill under the patched version passes, and so does the next incremental run"
        - "A backfill under the patched version whose record_ingested raises leaves the next incremental run refused"
        - "A catalog without an ingest log is not refused"
      tdd:
        red:
          test_file: "tests/test_silver_incremental.py"
          change: |
            First, in tests/test_silver_ingest.py, extend
            test_recorded_runs_come_back_with_their_days_and_start to assert
            run.transformation_version == "silver-v1".
            Then a new class TestVersionGuard in tests/test_silver_incremental.py with a fresh
            SqlCatalog and a synthetic landing: process every commit but the last incrementally,
            record every table's current snapshot id, patch
            src.silver.rebuild.TRANSFORMATION_VERSION to "silver-v2", process incrementally and
            assert BackfillRequired with "silver-v1", "silver-v2" and "backfill" in the message
            and unchanged snapshot ids. Add the three cases of the acceptance criteria; the
            failing backfill patches src.silver.rebuild.record_ingested to raise RuntimeError.
          command: "python -m unittest tests.test_silver_ingest tests.test_silver_incremental -v"
          expected_failure: "AttributeError: 'IngestedRun' object has no attribute 'transformation_version', then ImportError: cannot import name 'BackfillRequired' from 'src.silver.rebuild'"
        green:
          change: "The field on IngestedRun, the exception, the function with check (a) and its call in process_landing."
          command: "python -m unittest tests.test_silver_ingest tests.test_silver_incremental -v"
        refactor:
          change: "process_landing's docstring names BackfillRequired beside the other refusals."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
        - "src/silver/ingest.py"
        - "src/silver/rebuild.py"
        - "tests/test_silver_ingest.py"
        - "tests/test_silver_incremental.py"
