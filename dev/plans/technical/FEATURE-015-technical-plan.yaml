        - "contracts/**"
        - "src/synthetic/**"
        - "src/enrichment/**"
        - "src/silver/sql/**"
        - "src/silver/sink.py"
      can_run_parallel_with: []
      reversible: true
      rollback: "Revert the commit"
      files_to_create: []
      files_to_modify:
        - "src/silver/ingest.py"
        - "src/silver/rebuild.py"
        - "tests/test_silver_ingest.py"
        - "tests/test_silver_incremental.py"

    - id: "1.2"
      title: "Redaction-version guard"
      description: |
        Add check (b) to require_current_versions: the current snapshot summary of listing_text.
      status: "done"
      complexity: "low"
      estimated_hours: 1.0
      depends_on: ["1.1"]
      branch: "feature/run-guards/1.2-redaction-version-guard"
      commit_message: "feat(silver): an incremental run is refused under another redaction version"
      acceptance_criteria:
        - "An incremental process_landing under a patched REDACTION_VERSION raises BackfillRequired naming 'r2', the patched version and 'backfill', and no snapshot id changes"
        - "A listing_text whose current snapshot summary has no redaction_version is refused with 'unknown' in the message"
        - "A backfill under the patched version passes, and so does the next incremental run"
        - "A catalog without listing_text is not refused"
      tdd:
