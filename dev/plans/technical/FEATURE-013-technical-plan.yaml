      status: "done"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["1.2"]
      branch: "feature/property-groups-in-silver/2.1-run-writes-the-table"
      commit_message: "feat(silver): recompute listing_property_group in every run"
      acceptance_criteria:
        - "A backfill of the synthetic landing writes listing_property_group equal to the rule applied to the oracle's listing"
        - "syn-twin-a and syn-twin-b form the only group, complete, named syn:syn-twin-a; syn-new-unit has group_size 1"
        - "Commits processed one at a time and three at a time give the rows of a backfill"
        - "A catalog whose table was dropped gains it with the next run, equal to a backfill, and no other table's schema changes"
        - "A table overwritten with every listing as its own group equals a backfill after the next run"
        - "A run with nothing pending writes no snapshot of the table"
        - "The run's result names the table's snapshot id; listing_quality rows are unchanged"
      tdd:
        red:
          test_file: "tests/test_silver_incremental.py"
          change: |
            tests/test_silver_incremental.py: row_sets() and the nothing-pending test enumerate
