# Technical plan for FEATURE-013 — Property groups move from Gold to Silver.
# Emitted by the reviewer with the approval of 2026-11-16. It carries corrections M1 to M4,
# folded into the feature plan. Task statuses here are the source of truth for progress.

technical_plan:
  metadata:
    for_feature: "FEATURE-013"
    created_by: "reviewer_agent"
    created_at: "2026-11-16"
    version: "1.0"
    total_tasks: 7
    estimated_hours: "6"
    risk_level: "low"
    critical_path: ["1.1", "1.2", "2.1", "2.2", "2.3", "3.1", "3.2"]
    feature_plan: "dev/plans/FEATURE-013-property-groups-in-silver.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-013.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "workflow-consistency"
    # No coverage threshold is configured.
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"

  conventions: |
    - The table listing_property_group: one row per listing of Silver's listing with a detail
      record (detail_observed_at IS NOT NULL), ordered by source, source_listing_id. Columns, in
      order, with Arrow types:
        source                  string
        source_listing_id       string
        property_group_id       string   "<source>:<source_listing_id>" of the group's smallest
                                         member by (source, source_listing_id)
        group_size              int32    1 for a listing in no pair
        group_is_complete       bool     the group of n members holds n * (n - 1) / 2 pairs
        property_group_version  string   "pg1"
        transformation_version  string
      The Gold columns silver_listing_snapshot_id and built_at do not exist in Silver.
    - Rule pg1 is unchanged. src/silver/sql/pairs.sql is a copy of src/gold/sql/pairs.sql in
      which only the relation name changes, from gold_listing to property_group_listing; the
      macro, the conditions, the order and the header comment stay (review L1).
    - src/silver/property_group.py holds: PROPERTY_GROUP_TABLE = "listing_property_group",
      PROPERTY_GROUP_VERSION = "pg1", PRICE_GAP_MAX_PERCENT = 5, DISTANCE_MAX_METERS = 350,
      PROPERTY_GROUP_LISTING_COLUMNS (the thirteen columns Gold's LISTING_COLUMNS names, in that
      order), PROPERTY_GROUP_SCHEMA, and three public functions:
        duplicate_pairs(connection, listing) -> pyarrow.Table
        group_of(pairs) -> dict[ListingKey, ListingKey]
        property_group_rows(listing, pairs, *, transformation_version: str) -> pyarrow.Table
      Their behaviour is that of the Gold functions. The module does not import
      src.silver.rebuild, because rebuild.py imports it; the transformation version is passed in.
    - duplicate_pairs materialises its result and then unregisters property_group_listing, as
      listing_quality() does with its input.
    - Tasks 1.1 and 1.2 create copies and leave src/gold and its tests untouched; task 2.3
      deletes them (review M1). Do not make Gold import from Silver.
    - The table is not added to SILVER_TABLES: that tuple names the tables build_tables computes
      from one SQL file each. Tests that enumerate Silver's tables use
      (*SILVER_TABLES, PROPERTY_GROUP_TABLE) (review M3).
    - process_landing reads Silver's listing once, after the listings are written, with a
      constant LABEL_LISTING_COLUMNS: QUALITY_LISTING_COLUMNS followed by the columns of
      PROPERTY_GROUP_LISTING_COLUMNS it lacks. listing_quality() receives that table narrowed to
      QUALITY_LISTING_COLUMNS; the property groups are computed from the same table. The read
      happens before listing_quality() is called, because that call replaces the temporary table
      silver_listing that _silver_columns falls back to (review M3).
    - TRANSFORMATION_VERSION stays "silver-v1". No existing table, column or test expectation
      about other tables changes.
    - Tests use synthetic values only (source "syn", invented municipalities) and compare results
      as Arrow rows (to_pylist()), never through fetchall.
    - All repository artifacts are in English.

