            tests/test_silver_rebuild.py: the assertions over SILVER_TABLES that concern
            snapshot ids and written tables use (*SILVER_TABLES, PROPERTY_GROUP_TABLE).
          command: "python -m unittest tests.test_silver_incremental tests.test_silver_rebuild -v"
          expected_failure: "pyiceberg NoSuchTableError for the table listing_property_group, and the snapshot-id set comparison fails on the missing name"
        green:
          change: "The single read, the property group rows and the third entry of the write_silver_tables call."
          command: "python -m unittest tests.test_silver_incremental tests.test_silver_rebuild tests.test_silver_listing_quality -v"
        refactor:
          change: "One small helper for the label tables if it shortens process_landing; no other restructuring."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
