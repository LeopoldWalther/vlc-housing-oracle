    - id: "3.2"
      title: "Deployment, first real run, comparison and the Gold object (operator)"
      description: |
        Starts only after the integration branch is merged to main through the final PR.
        1. Wait for GitHub Actions to publish the image of the merge commit (tag = SHA).
        2. In the operator's local, gitignored infra/silver/silver.auto.tfvars set silver_image
           to that tag; terraform plan and apply in infra/silver. Only a new task definition
           revision and the consumer's reference to it may change. Never stage, print or commit
           the file.
        3. Let the next landing commit or the catch-up start a task. No backfill. From the task
           log take the listing_property_group snapshot id and the task's duration (log-stream
           creation to last event). Compare with the durations in
           dev/plans/implementations/FEATURE-008-listing-quality.md: 84 s for a run with data,
           30 s for a run on an empty commit.
        4. The comparison, in memory and as counts only (review M4). Create a git work tree at
           the first parent of the merge commit, which still holds src/gold. From there run a
           one-off script that is kept outside the repository and never committed. It:
             - loads the catalog and takes the current snapshots of listing and of
               listing_property_group; it stops when the latter was not committed after the
               former, and the operator waits for the next run;
             - scans listing at that snapshot with the old LISTING_COLUMNS and applies the old
               duplicate_pairs and property_group_rows;
             - scans the Silver table and prints, for each side: rows, groups of two or more,
               listings in such groups, incomplete groups, largest group; and across both:
               listings on one side only, and listings whose property_group_id, group_size or
               group_is_complete differ.
           Both difference counts must be 0. The script writes no file and no object; no row is
           printed. Remove the work tree afterwards.
        5. Only after step 4 passed and with its own explicit approval: delete the Gold object
           listing_property_group/part-0.parquet under the versioned Gold prefix.
        6. Write dev/plans/implementations/FEATURE-013-property-groups-in-silver.md with the
           counts beside those of the build of 2026-11-14 (21,840 rows, 1,832 groups, 4,849
           listings in a group, 187 incomplete groups), the snapshot date and the durations; set
           the feature plan to complete, tick its success criteria, add the progress-log entry
           and update the registry row.
        Every AWS action needs explicit user approval in chat.
      status: "not_started"
      complexity: "medium"
      estimated_hours: 1.5
      depends_on: ["3.1"]
      branch: "feature/property-groups-in-silver/3.2-first-run-record"
      commit_message: "docs(plans): FEATURE-013 first run and comparison with the old rule"
      acceptance_criteria:
        - "A Silver task after the deployment exits 0 and prints a listing_property_group snapshot"
        - "The Silver table and the rule of the commit before the merge agree on the same listing snapshot: both difference counts are 0"
        - "The task duration before and after is recorded"
        - "The Gold object is deleted, or the note says why it stays"
        - "The note holds counts only; the leak guard and the workflow validator pass"
      tdd: null
      validation_commands:
        - "python dev/tools/check_leaks.py"
        - "python dev/tools/validate_workflow.py"
      allowed_files:
        - "dev/plans/implementations/FEATURE-013-property-groups-in-silver.md"
        - "dev/plans/FEATURE-013-property-groups-in-silver.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-013-technical-plan.yaml"
      forbidden_files:
        - "src/**"
        - "tests/**"
        - "infra/**"
        - "analysis/**"
      can_run_parallel_with: []
      reversible: true
      rollback: "Set silver_image back to the previous tag and apply; drop the Silver table listing_property_group; the Gold object can be rebuilt with the command of the commit before the merge; revert the commit"
      files_to_create:
        - "dev/plans/implementations/FEATURE-013-property-groups-in-silver.md"
      files_to_modify:
        - "dev/plans/FEATURE-013-property-groups-in-silver.md"
        - "dev/plans/README.md"
        - "dev/plans/technical/FEATURE-013-technical-plan.yaml"

  git_workflow:
    base_branch: "main"
    integration_branch: "feature/property-groups-in-silver/integration"
    task_branch_strategy: |
      Create the integration branch from main and commit the planning artifacts there first, in
      one docs commit: the feature plans FEATURE-009 to FEATURE-013, the registry with their five
      rows, the review of FEATURE-013 and this file. The five rows sit in one uncommitted change
      of the registry, and a row without its plan file fails the workflow validator, so they go
      together. Task 1.1 starts from the integration branch; each later task up to 3.1 starts
      from the integration branch after its predecessor is merged. The tasks share one module
      and rebuild.py, so none runs in parallel. Task 3.2 starts from main after the final PR is
      merged.
    integration_strategy: |
      After explicit user approval, merge each verified task branch into the integration branch
      with --no-ff in the order 1.1, 1.2, 2.1, 2.2, 2.3, 3.1, never rewriting history, and run
      validation.final_commands there. The final PR goes from the integration branch to main.
      Task 3.2's branch goes to main through its own small PR.
    commit_strategy: "One focused commit per task, using the task's commit_message"
    commit_message_format: "<type>(<scope>): <description>"
    allowed_commit_types: ["feat", "test", "docs", "chore"]
    push_policy: "Never push or open a PR without explicit user approval; GitHub-visible activity on weekdays only after 17:00 Europe/Berlin, on weekends at any time"
    final_pr_title: "feat(silver): property groups move from Gold to Silver"
    final_pr_description: |
      Implements FEATURE-013: Silver gains listing_property_group, recomputed whole from listing
