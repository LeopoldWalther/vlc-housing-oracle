        Create src/silver/property_group.py with the constants, PROPERTY_GROUP_LISTING_COLUMNS and
        duplicate_pairs(), and src/silver/sql/pairs.sql as the copied statement reading
        property_group_listing. Create tests/test_silver_property_pairs.py as a copy of
        tests/test_gold_property_pairs.py that imports from src.silver.property_group; every case
        and expectation stays. Do not touch src/gold or its tests.
      status: "done"
      complexity: "low"
      estimated_hours: 0.75
      depends_on: []
      branch: "feature/property-groups-in-silver/1.1-pair-rule"
      commit_message: "feat(silver): the pair rule pg1 as a Silver module"
      acceptance_criteria:
        - "Every case of the Gold pair tests passes against src.silver.property_group.duplicate_pairs with unchanged expectations"
        - "pairs.sql under src/silver/sql differs from the Gold statement only in the relation name"
        - "After the call the connection holds no registered relation property_group_listing"
        - "src/silver/property_group.py does not import src.silver.rebuild"
        - "The existing suite, including the Gold tests, is unchanged and green"
      tdd:
        red:
          test_file: "tests/test_silver_property_pairs.py"
          change: |
            Copy tests/test_gold_property_pairs.py and change the import to
            `from src.silver.property_group import duplicate_pairs`. Add one case: after
            duplicate_pairs returns, selecting from property_group_listing on the same connection
            raises duckdb.CatalogException.
          command: "python -m unittest tests.test_silver_property_pairs -v"
          expected_failure: "ModuleNotFoundError: No module named 'src.silver.property_group'"
        green:
          change: |
            The module with the constants and duplicate_pairs(); the copied statement with the
            relation renamed.
          command: "python -m unittest tests.test_silver_property_pairs -v"
        refactor:
          change: "Thresholds stay named constants set as DuckDB variables; the statement's header comment names the Silver module."
          command: "python -m unittest discover -s tests -t . -v && ruff check src tests dev && ruff format --check src tests dev"
      validation_commands:
        - "python -m unittest discover -s tests -t . -v"
        - "ruff check src tests dev && ruff format --check src tests dev"
        - "python dev/tools/check_leaks.py"
      allowed_files:
