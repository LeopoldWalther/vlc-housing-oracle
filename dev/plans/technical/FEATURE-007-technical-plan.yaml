# Technical plan for FEATURE-007 — Property groups: one property behind several listings.
# Emitted by the reviewer with the approval of 2026-11-14. It carries corrections M1 to M5,
# folded into the feature plan. Task statuses here are the source of truth for progress.

technical_plan:
  metadata:
    for_feature: "FEATURE-007"
    created_by: "reviewer_agent"
    created_at: "2026-11-14"
    version: "1.0"
    total_tasks: 10
    estimated_hours: "10"
    risk_level: "low"
    critical_path: ["1.1", "1.2", "1.3", "2.1", "2.2", "3.1", "3.2", "3.3", "4.1", "4.2"]
    feature_plan: "dev/plans/FEATURE-007-property-groups.md"
    reviewed_plan: "dev/reviews/REVIEW-FEATURE-007.md"

  validation:
    required_checks:
      - "python-lint-and-test"
      - "workflow-consistency"
    # No coverage threshold is configured.
    min_coverage: null
    baseline_commands:
      - "pip install -r requirements.txt -r requirements-dev.txt"
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"
    final_commands:
      - "python -m unittest discover -s tests -t . -v"
      - "python dev/tools/check_leaks.py"
      - "python dev/tools/validate_workflow.py"
      - "ruff check src tests dev && ruff format --check src tests dev"

  conventions: |
    - Everything lives in src/gold/property_group.py and src/gold/sql/pairs.sql. No base class,
      registry or shared Gold module is introduced.
    - A listing key is (source, source_listing_id). Only listings with detail_observed_at not
      null take part.
    - Pair rule pg1 (PROPERTY_GROUP_VERSION = "pg1"); two distinct listings pair when all hold:
        equal operation, municipality, rooms, bathrooms, sqm_built, none of them null;
        100 * higher price_eur <= (100 + PRICE_GAP_MAX_PERCENT) * lower price_eur, with
          PRICE_GAP_MAX_PERCENT = 5, in integer arithmetic;
        both have latitude and longitude, and the haversine distance on a sphere of radius
          6,371,000 m is < DISTANCE_MAX_METERS = 350;
        floor: if condition = 'new' on either side, both floors non-null and equal; otherwise
          floors equal or at least one null. A null condition counts as not new.
      The source is not compared. Each pair is returned once, smaller key first.
    - Public functions:
        duplicate_pairs(connection, listing) -> pyarrow.Table
            columns source_a, source_listing_id_a, source_b, source_listing_id_b.
        group_of(pairs) -> dict[ListingKey, ListingKey]
            maps every listing that is in a pair to the smallest key of its connected component.
        property_group_rows(listing, pairs, *, snapshot_id, built_at) -> pyarrow.Table
            one row per listing with a detail record, columns in this order: source,
            source_listing_id, property_group_id, group_size, group_is_complete,
            property_group_version, silver_listing_snapshot_id, built_at; ordered by source,
            source_listing_id. property_group_id = "<source>:<source_listing_id>" of the group's
            smallest key. group_is_complete = the group's pair count equals n * (n - 1) / 2.
        build(catalog, out, *, now) -> BuildReport (frozen dataclass of counts)
            reads vlc_housing_silver.listing: takes current_snapshot().snapshot_id once and scans
            with snapshot_id= that value and only the columns the rule needs; writes
            <out>/listing_property_group/part-0.parquet through
            pyarrow.fs.FileSystem.from_uri(out).
        main(argv) -> int: exit 0 on success, 1 when the catalog has no listing table
            (PropertyGroupError), 2 on usage.
    - The namespace comes from src.silver.rebuild.NAMESPACE. Gold imports from Silver, never the
      reverse.
    - Tests use synthetic values only and coordinates near (39.47, -0.37): 0.003 degrees of
      latitude is 333.6 m (pairs), 0.0032 degrees is 355.8 m (does not pair).
    - Output of the command and of every note is counts only.
    - All repository artifacts are in English.

