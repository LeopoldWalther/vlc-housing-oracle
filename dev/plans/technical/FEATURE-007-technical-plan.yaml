        2. Take the printed counts. Compare them with the architect's evidence of 2026-11-14
           (1,832 groups over 4,849 listings, 187 incomplete, largest 19): equal or larger,
           because listings were added since.
        3. In Athena or DuckDB, privately: confirm the file has one row per listing with a
           detail record at the recorded snapshot, and that count(DISTINCT property_group_id)
           equals the reported group count plus the single listings.
        4. Write dev/plans/implementations/FEATURE-007-property-groups.md with the counts and
           the snapshot's date; set the feature plan to complete, tick its success criteria, add
           the progress-log entry and update the registry row.
