# Builds the Silver image on every pull request and publishes it on main.
#
# No AWS credential exists in this repository: the image goes to the GitHub container registry
# with the workflow's own token, and the Fargate task pulls it as a public image. The task runs an
# exact commit tag set by Terraform, never "latest", so a new image runs only after the operator
# deploys it.

name: Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: silver-image
    # Native ARM64, the Fargate platform; pinned like every runner here.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registry names must be lowercase; the owner name is not.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-silver" >> "$GITHUB_ENV"

      - name: Log in to the GitHub container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push on main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
