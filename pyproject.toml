# Tooling configuration only. This project is not packaged as a distribution: runtime dependencies
# live in requirements.txt and nothing installs the repository itself.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly rather than inherited: ruff's defaults widen between releases, and relying on
# them makes the check a moving target that turns red on a day nobody touched the code.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4"]
